# warroom project config — owned by this repository.
# `warroom` updates NEVER write to this file. That structural boundary is what
# makes fleet propagation safe: generated content and project content never
# share a destination.
#
# Required:
session: agentvibe
project_dir: ~/VibeCoding/Agentvibe

# Optional — each defaults to the derivation the standalone launchers hardcoded:
#   display_name  defaults to session, uppercased        (banner text)
#   state_dir     defaults to ~/.<session>               (snapshots, events.jsonl)
#   entry_ceo     defaults to .claude/entry/ceo.md,
#                 falling back to .claude/agents/_seeds/ceo.md

# Codex engine — explicit acknowledgment that a Codex pane is NOT sandboxed.
# A Codex pane is one unscoped process: the per-engine tool scoping that makes a
# `reviewer` structurally unable to Write does not hold inside it. The boundary
# there is prose and a warning, not a control.
# Required before `--engine codex` will launch anything.
# See docs/03-system-design/final-v2/research/codex-in-the-pane.md §9.
codex_unsandboxed_ack: true
