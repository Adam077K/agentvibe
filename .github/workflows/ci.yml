# POSTURE: BLOCKS. Every check here is deterministic — it executes code and
# compares the result to the repository, so a failure is a fact, not a judgment.
#
# This is the first workflow this repository has ever run. Before it, the QA gate
# CLAUDE.md called "sacred" lived in a directory GitHub does not read, and
# `schema-lint.js` — 360 correct lines with a blocking exit path — was registered
# nowhere at all.
#
# The judged gate (qa-lead-pass.yml) shipped in shadow alongside this and was promoted to
# blocking in Phase 3, with `main` under branch protection requiring both jobs. This
# comment said "deliberately does NOT block yet" for one phase after that stopped being
# true — a small instance of the exact rot this repository exists to catch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is NOT load-bearing for pass/fail, and this comment used to say it
      # was. Lens provenance cites git history (`git:<path>@<rev>`), but it is checked
      # against `.claude/provenance/sources.json`, which travels with the tree — a shallow
      # clone, and a generated project with an empty object store, both PASS. What full
      # history buys is a stronger check, and that is the ONLY reason stated here: where the
      # objects are reachable, schema-lint compares their sha256 to the manifest instead of
      # trusting the record, and the provenance step's case C can run instead of skipping.
      #
      # An earlier version of this comment added "and the ledger's resolvers read git log".
      # They do not — ledger.mjs uses `git ls-files`, which reads the index. Replacing one
      # unverified justification with another is the failure this whole change is about.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Mission Control (mission-control/) is Bun/Hono, not Node — this is the only
      # thing in the repo that needs it. Pinned to match the version bun.lock was
      # generated and validated against locally (1.3.10) — this step is inside a
      # required status check on protected main, so `latest` drifting to a newer
      # Bun release could turn main red on a PR that changed nothing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Validates agent frontmatter, mandatory body sections, model IDs, maxTurns
      # ranges, and every declared skill against MANIFEST.json.
      - name: Agent schema lint
        run: node .claude/hooks/schema-lint.js

      # The prompt standard — docs/03-system-design/agents/PROMPT-STANDARD.md §6, as PS-* rules
      # inside the same linter. Its §0 binds every rule to a method, and this step is what keeps
      # the method honest: each blocking rule is asserted to hit ZERO on the seven live engines AND
      # to FIRE on a constructed violation. A rule that fires on nothing is not a rule, and that is
      # not a hypothetical here — a `maxTurns` range check sat in this repo for months while any
      # quoted value walked straight past it, because nothing ever constructed the string case.
      #
      # It also pins the two numbers the standard measured: PS-BODY-VAGUE fires on 6 of 7 files at
      # 10 sites, every one of them correct prose, which is why it can only ever warn.
      - name: Prompt standard
        run: npm run check:prompt-standard

      # 23 tests over the QA verdict logic: severity eligibility, tier gating,
      # confirmation parsing, finding caps. They passed all along; nothing ran them.
      - name: Gate logic tests
        run: node --test .claude/workflows/lib/gate-logic.test.mjs

      # The skills MANIFEST is generated from disk. This fails if someone
      # hand-edited it or added a skill without regenerating.
      - name: Skills manifest matches disk
        run: node scripts/build-skills-manifest.mjs --check

      # The skills curation and the two-tier discovery layer. Every cut names the test it
      # failed in CURATION.yml, and these fail when the directory drifts from that decision
      # — so a skill cannot creep back in, and a survivor cannot quietly vanish.
      - name: Skills curation matches CURATION.yml
        run: npm run check:curation

      - name: Skill routers match namespaces
        run: npm run check:routers

      # Fabrication catcher: dead paths in governing docs, hooks registered to
      # missing files, README counts that drifted, skills declared but absent.
      - name: Registration completeness
        run: node scripts/check-registration.mjs

      # Check 11 of that script guards the DATA a hook reads, not just the hook command:
      # .claude/mcp-policy.json decides whether an MCP call is refused, and deleting it used
      # to turn governance off while failing nothing. These tests move the file off disk for
      # real and run the real checker, because a check for a silent failure that is itself
      # only asserted has the same shape as the bug it prevents.
      - name: Registration checker guards hook data files
        run: npm run test:registration

      # Dispatch identity. `agentType` is the entire container — tool grant, model, isolation —
      # and omitting it, naming a shim, or naming a file that no longer exists all land on the
      # same runtime default: `general-purpose`, tools `*`, holding Write, Edit and Bash. All
      # three fail silently. Measured 2026-08-16: eight of twelve dispatch sites were in one of
      # those states, including every research dispatch — the containers that read the open web.
      #
      # This is the regression test for the `agentType: 'reviewer'` repair in qa.js, and it runs
      # its own mutation gate first: a fixture with a known-bad site the checker must flag, so a
      # parser that silently stops seeing dispatches fails here rather than reporting clean.
      - name: Dispatch agentType
        run: npm run check:dispatch

      # PS-DISPATCH-BRIEF-SIZE: warns on inline literals ≥30,000 chars or fenced blocks >200 lines
      # in .claude/workflows/*.js dispatch sites. WARN posture — exits 0 on violations, 1 only on
      # the non-vacuity floor (scanner broken). Memory budget: DECISIONS.md ≤50 entries + ≤40,000 bytes;
      # LONG-TERM.md ≤100 lines. Both fail the build (exits 1) on a real violation.
      - name: Dispatch prompt size
        run: npm run check:dispatch-prompt

      - name: Memory budget
        run: npm run check:memory

      # CODEBASE-MAP.md is generated, not written. A hand-maintained map is accurate exactly
      # until the first person forgets, and then it is trusted and wrong — which is worse
      # than no map. This fails when it drifts from disk.
      - name: Codebase map matches disk
        run: npm run check:map

      # The launcher every project starts from, plus the install/rollback guard
      # rails. Syntax, then 11 tests that run the installer against a temporary
      # HOME — including the regression for a backup restored without its
      # executable bit, which shipped because the manual pass never constructed
      # the mismatch it needed.
      #
      # NOTE: scripts/warroom-parity.sh proves byte-identical behaviour against
      # the standalone launcher it replaces, but that launcher lives in ~/bin
      # and does not exist on a CI runner. Parity is therefore verified locally
      # and recorded in the PR; CI covers syntax and the guard rails. This limit
      # is stated rather than papered over.
      - name: Warroom launcher + install guard rails
        run: npm run check:warroom

      # The lens layer — the encoded expertise, as linted data rather than agent prose.
      # These tests construct the failures rather than trusting the rules fire: a vague
      # step, a placeholder, a lens citing a source that does not exist, and an
      # "independent" review panel drawn from a single model family.
      - name: Lens files
        run: npm run test:lenses

      # Lens provenance, in a repository that has none of this repository's git objects.
      # `~/bin/newproject` generates projects by rsyncing the tree without `.git` and then
      # `git init`-ing, so every `git:<path>@<rev>` citation resolved to nothing and this
      # lint exited 1 on a brand-new project before anyone touched it. The remedy is
      # `.claude/provenance/sources.json`; this step runs the real linter against a scratch
      # repo with an empty object store, and also fails when the committed manifest has
      # drifted from what the lens files cite.
      - name: Lens provenance travels
        run: npm run test:provenance

      # Playbooks — stages and exit criteria, never method. The rule that a playbook
      # may not carry `steps:` is what stops it drifting back into the pipeline prose
      # it replaced, and the tests construct that failure rather than trusting it.
      - name: Playbooks
        run: npm run test:playbooks

      # The SessionStart hook. It is the mechanical consumer of the lens and playbook
      # files — before Phase 6 both were linted on every PR and loaded by nothing — and it
      # is what reports a ledger sweep that has stopped running. Every test below is a case
      # where saying nothing would have been indistinguishable from saying "all clear",
      # which is the failure this phase exists to catch.
      - name: SessionStart hook
        run: npm run test:hooks

      # Spend measurement and the ceiling that acts on it. Every transcript in these tests
      # is constructed: a test reading real usage would pass or fail for reasons it did not
      # choose, and ~/.claude/projects does not exist on a CI runner at all.
      - name: Budget and stall
        run: npm run test:budget

      # The router that decides whether the binding gate (.claude/workflows/qa.js) must run
      # for a diff. qa.js works and has run; until 2026-08-16 NOTHING routed to it, so the
      # merge gate fell back to grepping a `qa_verdict: PASS` string written by the author of
      # the change under review. That is why its record was 34 PASS and 0 refusals.
      #
      # These tests pin the DECISION: docs stay ungated, one hook path floors an otherwise
      # harmless PR at irreversible, and an unreadable ref exits 2 rather than reporting
      # "nothing to gate" — fail-open in a router is indistinguishable from no router.
      - name: Gate routing
        run: npm run test:run-gate

      # A SKILL.md carrying `allowed-tools` SUBTRACTS from whatever agent loads it — the binary
      # documents the field as "Tools available to the model while this file is active", which
      # is a ceiling, not a grant. Eight skills declare it; two clamp to a single Bash pattern.
      # `impeccable` is the skill the roster spec assigns to `designer`, and it would leave that
      # agent unable to Read, Write, or reach a browser.
      #
      # Currently vacuous — no agent declares one — which is precisely when it is cheap to pin.
      - name: Skill tool clamps
        run: npm run test:skill-clamp

      # The stop_reason aggregation. Every transcript in these tests is constructed — CI has no
      # ~/.claude/projects at all. Pinned because this file's bucketing was silently wrong once
      # (it split on "contains a subagent turn anywhere" rather than "the final turn was one")
      # and was caught by reading the output rather than by a test.
      - name: Stop-reason probe
        run: npm run test:probe-stop-reason

      # The launcher passed --dangerously-skip-permissions, which made all 26 allow/deny rules in
      # settings.json inert in every warroom-started session. Removed 2026-08-16 by founder
      # decision, after measuring the friction: 11,342 Bash calls over 400 transcripts, 8,603
      # already covered; bun/bunx/npm were the real gap and went into the allow list with it.
      # Pinned because one word restores the flag silently and nothing else would fail.
      - name: Launcher permissions
        run: npm run test:launcher-permissions

      # The sandbox block in .claude/settings.json is armed (enabled: true,
      # failIfUnavailable: true). Armed 2026-08-17 by Founder decision. This test fails
      # if sandbox.enabled is turned back off, if failIfUnavailable is set to false, or
      # if any required denyRead credential path is removed.
      # Revert: set sandbox.enabled: false + sandbox.failIfUnavailable: false in
      # .claude/settings.json and restart your Claude Code session.
      # See docs/03-system-design/SANDBOX.md § Emergency revert.
      - name: Sandbox config armed
        run: npm run test:sandbox

      # Tier gate unit tests (Design B, issue #85).
      # The label-based enforcement was a second implementation of a fact the classifier
      # already owns. It drifted silently — PR #78 opened correctly as risk:full, then
      # adding two `run:` steps raised the floor to irreversible and the label became wrong.
      # A machine reading the classifier at every sync cannot get that wrong.
      #
      # These 17 tests pin the one safety property: floor=irreversible cannot be satisfied
      # by sessions that declare lower tiers. The "cannot lower" tests run first — if they
      # fail, the gate is broken.
      - name: Tier gate
        run: npm run test:tier-gate

      # The claim ledger. Four things, all deterministic:
      #   · the parser and schema (43 tests, most of them "this must REFUSE")
      #   · the tier map, run against a path list rather than read
      #   · the resolvers, with dead DNS / 404 / moved-quote / timeout constructed
      #     rather than hoped for
      #   · the index, which must reproduce byte-identically from this clean clone —
      #     that is what makes "the index is never hand-edited" true instead of asked for
      #
      # `ledger verify` then runs every resolver for real. It exits non-zero ONLY when a
      # claim on an `enforcement: block` path fails (migration, deploy, harness
      # self-edit). Everything else is written to events.jsonl as claim.would_block and
      # the build stays green — that is shadow mode, and it is what the Phase 3 window
      # is measuring.
      #
      # The canary at docs/06-codebase/ledger-canary.md must produce exactly two
      # would_block lines on every run. Zero means the resolvers stopped firing.
      - name: Claim ledger
        run: npm run check:ledger

      # Mission Control's rail: bun install pinned to the committed lockfile (a drifted
      # lockfile fails here rather than silently resolving something else), then the
      # same check:mc that runs locally — bun/deps probe, then bun test.
      - name: Mission Control
        run: bun install --frozen-lockfile --cwd mission-control && npm run check:mc
