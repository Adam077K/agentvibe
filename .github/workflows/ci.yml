# POSTURE: BLOCKS. Every check here is deterministic — it executes code and
# compares the result to the repository, so a failure is a fact, not a judgment.
#
# This is the first workflow this repository has ever run. Before it, the QA gate
# CLAUDE.md called "sacred" lived in a directory GitHub does not read, and
# `schema-lint.js` — 360 correct lines with a blocking exit path — was registered
# nowhere at all.
#
# The judged gate (qa-lead-pass.yml) shipped in shadow alongside this and was promoted to
# blocking in Phase 3, with `main` under branch protection requiring both jobs. This
# comment said "deliberately does NOT block yet" for one phase after that stopped being
# true — a small instance of the exact rot this repository exists to catch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing. Lens provenance survives the Phase 4b deletions by
      # citing git history (`git:<path>@<rev>`), and schema-lint verifies those with
      # `git cat-file -e`. A shallow clone cannot resolve them, so the lint would fail for
      # a reason the PR did not cause.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Mission Control (mission-control/) is Bun/Hono, not Node — this is the only
      # thing in the repo that needs it. bun-version: latest rather than pinned because
      # this step has no blocking dependents yet; pin it the day that changes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Validates agent frontmatter, mandatory body sections, model IDs, maxTurns
      # ranges, and every declared skill against MANIFEST.json.
      - name: Agent schema lint
        run: node .claude/hooks/schema-lint.js

      # 23 tests over the QA verdict logic: severity eligibility, tier gating,
      # confirmation parsing, finding caps. They passed all along; nothing ran them.
      - name: Gate logic tests
        run: node --test .claude/workflows/lib/gate-logic.test.mjs

      # The skills MANIFEST is generated from disk. This fails if someone
      # hand-edited it or added a skill without regenerating.
      - name: Skills manifest matches disk
        run: node scripts/build-skills-manifest.mjs --check

      # The skills curation and the two-tier discovery layer. Every cut names the test it
      # failed in CURATION.yml, and these fail when the directory drifts from that decision
      # — so a skill cannot creep back in, and a survivor cannot quietly vanish.
      - name: Skills curation matches CURATION.yml
        run: npm run check:curation

      - name: Skill routers match namespaces
        run: npm run check:routers

      # Fabrication catcher: dead paths in governing docs, hooks registered to
      # missing files, README counts that drifted, skills declared but absent.
      - name: Registration completeness
        run: node scripts/check-registration.mjs

      # CODEBASE-MAP.md is generated, not written. A hand-maintained map is accurate exactly
      # until the first person forgets, and then it is trusted and wrong — which is worse
      # than no map. This fails when it drifts from disk.
      - name: Codebase map matches disk
        run: npm run check:map

      # The launcher every project starts from, plus the install/rollback guard
      # rails. Syntax, then 11 tests that run the installer against a temporary
      # HOME — including the regression for a backup restored without its
      # executable bit, which shipped because the manual pass never constructed
      # the mismatch it needed.
      #
      # NOTE: scripts/warroom-parity.sh proves byte-identical behaviour against
      # the standalone launcher it replaces, but that launcher lives in ~/bin
      # and does not exist on a CI runner. Parity is therefore verified locally
      # and recorded in the PR; CI covers syntax and the guard rails. This limit
      # is stated rather than papered over.
      - name: Warroom launcher + install guard rails
        run: npm run check:warroom

      # The lens layer — the encoded expertise, as linted data rather than agent prose.
      # These tests construct the failures rather than trusting the rules fire: a vague
      # step, a placeholder, a lens citing a source that does not exist, and an
      # "independent" review panel drawn from a single model family.
      - name: Lens files
        run: npm run test:lenses

      # Playbooks — stages and exit criteria, never method. The rule that a playbook
      # may not carry `steps:` is what stops it drifting back into the pipeline prose
      # it replaced, and the tests construct that failure rather than trusting it.
      - name: Playbooks
        run: npm run test:playbooks

      # The SessionStart hook. It is the mechanical consumer of the lens and playbook
      # files — before Phase 6 both were linted on every PR and loaded by nothing — and it
      # is what reports a ledger sweep that has stopped running. Every test below is a case
      # where saying nothing would have been indistinguishable from saying "all clear",
      # which is the failure this phase exists to catch.
      - name: SessionStart hook
        run: npm run test:hooks

      # Spend measurement and the ceiling that acts on it. Every transcript in these tests
      # is constructed: a test reading real usage would pass or fail for reasons it did not
      # choose, and ~/.claude/projects does not exist on a CI runner at all.
      - name: Budget and stall
        run: npm run test:budget

      # The claim ledger. Four things, all deterministic:
      #   · the parser and schema (43 tests, most of them "this must REFUSE")
      #   · the tier map, run against a path list rather than read
      #   · the resolvers, with dead DNS / 404 / moved-quote / timeout constructed
      #     rather than hoped for
      #   · the index, which must reproduce byte-identically from this clean clone —
      #     that is what makes "the index is never hand-edited" true instead of asked for
      #
      # `ledger verify` then runs every resolver for real. It exits non-zero ONLY when a
      # claim on an `enforcement: block` path fails (migration, deploy, harness
      # self-edit). Everything else is written to events.jsonl as claim.would_block and
      # the build stays green — that is shadow mode, and it is what the Phase 3 window
      # is measuring.
      #
      # The canary at docs/06-codebase/ledger-canary.md must produce exactly two
      # would_block lines on every run. Zero means the resolvers stopped firing.
      - name: Claim ledger
        run: npm run check:ledger

      # Mission Control's rail: bun install pinned to the committed lockfile (a drifted
      # lockfile fails here rather than silently resolving something else), then the
      # same check:mc that runs locally — bun/deps probe, then bun test.
      - name: Mission Control
        run: bun install --frozen-lockfile --cwd mission-control && npm run check:mc
