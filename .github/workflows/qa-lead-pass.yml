# POSTURE: BLOCKS. Promoted from shadow to blocking in Phase 3, 2026-08-11.
#
# It ran in shadow for the whole of Phases 1 and 2 — computing the full verdict,
# printing `[shadow] WOULD BLOCK`, and failing nothing. That was the right way to
# start: every gate ships in shadow first so the friction is measured rather than
# guessed. But a gate that never blocks is not a gate, and shadow mode with no
# promotion criterion is just a disabled check with better manners.
#
# THE EVIDENCE THAT PROMOTED IT. Across every PR of Phases 1 and 2 the shadow
# verdict was correct each time and never once demanded ceremony that was not
# already being done — the session file with `qa_verdict: PASS` is written for
# every task anyway, because CLAUDE.md's documentation gate requires it. The
# friction it adds is therefore zero, which is the only honest reason to promote a
# rule to blocking.
#
# What it enforces:
#   1. A QA verdict bound to THIS PR'S EXACT DIFF (scripts/verdict.mjs), posted as a
#      check-run posted with this workflow's own GITHUB_TOKEN — or the founder posted
#      an explicit `BYPASS REASON:` comment NAMING THAT DIFF'S SUBJECT, under a bypass
#      label. (This line said "signed by" until 2026-08-26, 400 lines above another line
#      in this same file calling "signed" the exact word that makes a reader stop asking.
#      A token authenticates the poster; it signs nothing.)
#      (Grepping session files for `qa_verdict: PASS` was removed 2026-08-23 (P0.1) —
#      that trusted PR-author-authored prose as if it were review output. Before that,
#      slug matching against the whole sessions directory was removed 2026-08-15 — it
#      let a branch inherit a PASS written for work already merged to main.)
#   2. When the classifier floor is `irreversible`, at least one session file in this
#      PR declares `tier: full` or `tier: irreversible`.
#
# NOTE: The `risk:*` label is NO LONGER REQUIRED (Design B, issue #85, 2026-08-17).
# It is display-only — cosmetic metadata the founder can apply for visibility, but
# nothing here reads it. The classifier floor IS the enforcement. A label was a
# second statement of a fact the classifier already owns; it drifted silently. PR #78
# proved this when two `run:` steps raised the floor mid-review and the label became
# wrong. The next `synchronize` event recomputes the correct floor; a stored label does
# not update itself.
#
# The tier floor comes from scripts/classify.mjs — the ONE classifier. The 25 lines
# of bash that used to reimplement that matching inline are gone; two
# implementations of risk classification will disagree, and you find out during the
# incident. The label check was a third implementation. It is gone too.
#
# THIS JOB IS A REQUIRED CHECK. Superseded 2026-08-26 — this paragraph read "Making
# this a REQUIRED check in branch protection is a repository setting, not a file, and
# is the founder's call. Until it is required, a failure here is visible and red but
# does not physically prevent a merge." That became false at some point nobody
# recorded, and it understated the enforcement rather than overstating it — the rarer
# and quieter direction, which is why it survived. Measured 2026-08-26 against the
# live API, `gh api repos/:owner/:repo/branches/main/protection`:
#
#     required_status_checks.strict   : true
#     required_status_checks.contexts : ["Deterministic checks", "Verify QA Lead PASS"]
#     checks[].app_id                 : 15368 (GitHub Actions) for BOTH contexts
#     enforce_admins                  : false
#     required_signatures             : false
#
# `Verify QA Lead PASS` is this job's `name:`. Renaming that job silently un-requires
# it — branch protection matches the context by NAME, so a rename leaves the required
# context permanently unreported and the PR blocked, which is at least fail-closed.
# Do not rename it casually.
#
# Read the "What this gate actually guarantees" block above the verdict step before
# concluding that being required makes the result trustworthy. Required means the
# check must report success before the PR merges. It does not mean the success was
# earned, and the two are further apart here than the word "required" suggests.
name: QA Lead Pass

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read   # F12: Required for gh api repos/$REPO/issues/$PR_NUMBER/comments (bypass comment check)
  checks: write  # Required to post the diff-bound verdict as a check-run. What this actually
                 # buys, and what it does not, is spelled out at the "Verdict diff-binding check"
                 # step below — read that before assuming the token makes this unforgeable.

jobs:
  qa-gate:
    name: Verify QA Lead PASS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for QA gate bypass
        id: bypass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADAM_GITHUB_USER: ${{ vars.ADAM_GITHUB_USER }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== QA gate bypass check for PR #${PR_NUMBER} ==="
          echo "The pass/fail decision is made by the 'Verdict diff-binding check' step"
          echo "below, which reads a verdict record whose FILENAME is the sha256 of this"
          echo "diff — not by grepping session file content, which a PR author can write"
          echo "to say anything. This step only gathers whether the founder granted an"
          echo "explicit bypass; it no longer decides one. See the binding note below."

          # ── Bypass label ──────────────────────────────────────────────────
          HAS_BYPASS_LABEL=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json labels \
            --jq '[.labels[].name] | contains(["qa-lead-bypass"])')

          echo "Has qa-lead-bypass label: ${HAS_BYPASS_LABEL}"

          # ── Bypass label present → collect Adam's bypass comments ──────────
          # THIS STEP STILL GRANTS THE BYPASS — but only for a NAMED DIFF. It used to
          # grant on finding any comment by ADAM_GITHUB_USER containing "BYPASS REASON:",
          # and the verdict step honoured that flag whatever the diff had become since.
          #
          # That is the SAME defect the subject hash exists to remove, one branch over.
          # This file has already had it removed twice from the PASS path — slug-matched
          # session files (2026-08-15) let a branch inherit a PASS written for work
          # already merged; grepping session prose (2026-08-23) trusted the author.
          # Both were "an authorisation not bound to the thing it authorises". The
          # OVERRIDE path was never swept for the same class and still carried it:
          # a bypass granted for a one-line typo stayed valid for every later push to
          # that PR, including a rewrite of this workflow. The label is sticky, the
          # comment is immutable, and nothing recomputed.
          #
          # The decision is made here and crosses to the verdict step as a boolean on an
          # immutable channel. Both are initialised before any branch: `set -u` is active,
          # and an unset variable at the emit below would abort the step.
          BYPASS_APPROVED=false
          BYPASS_SUBJECT=""
          if [ "$HAS_BYPASS_LABEL" = "true" ]; then
            if [ -z "$ADAM_GITHUB_USER" ]; then
              echo "ERROR: ADAM_GITHUB_USER variable is not set — cannot validate bypass author"
              echo "  Measured 2026-08-26: repos/:owner/:repo/actions/variables returns"
              echo "  total_count=0, so this variable is UNSET today and the bypass path"
              echo "  cannot be used at all — applying the label fails this job rather than"
              echo "  passing it. That is the correct direction to fail, but it does mean"
              echo "  the documented escape hatch is inert until the founder sets the"
              echo "  ADAM_GITHUB_USER repository variable."
              exit 1
            fi

            # Each qualifying comment BODY, @json-encoded so one comment is one line
            # whatever newlines it contains. That keeps "the marker and the subject in
            # the SAME comment" checkable, which a line-agnostic search could not tell
            # apart from the marker in one comment and the subject in another.
            #
            # --paginate was missing here: the default page is 30 comments, so a bypass
            # comment on a long thread was invisible. Fail-closed, but wrong.
            #
            # HELD IN A VARIABLE, NOT A FILE. A first version of this wrote the bodies
            # to "$RUNNER_TEMP/bypass-comments.txt" and let the verdict step four steps
            # later read them back. That moved the authorisation evidence onto a MUTABLE
            # channel: between the write and the read, this job runs `scripts/classify.mjs`
            # and `scripts/ledger.mjs` — PR-authored repo code — either of which could
            # rewrite the file to name a subject the founder never approved. Demonstrated
            # in review, and it is not excused by "anyone who can edit scripts/ can edit
            # this workflow": the remedy this file recommends is CODEOWNERS over
            # `/.github/`, and under that remedy `.github/**` is protected while
            # `scripts/**` is not. The hole would have opened on the day the fix landed.
            #
            # $GITHUB_OUTPUT is parsed by the runner when the step ends and is immutable
            # thereafter, so the decision — not the evidence for it — crosses the gap.
            BODIES=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.user.login == \"$ADAM_GITHUB_USER\") | select(.body | test(\"BYPASS REASON:\")) | .body | @json")

            if [ -n "$BODIES" ]; then
              # The subject is computed HERE, by the same single implementation the
              # verdict step uses, because this is the step that decides. `set -e` is
              # active (this step does not clear it), so a failure to compute the
              # subject fails the job rather than reaching a comparison with garbage.
              BYPASS_SUBJECT=$(node scripts/verdict.mjs subject)

              # Derived, not taken on trust: verdict.mjs computes the subject as
              # crypto.createHash('sha256')...digest('hex') — 64 lowercase hex digits.
              # Verified by running `verdict.mjs subject` and measuring: len=64, matches.
              # An unvalidated subject is how an empty string reaches a substring match
              # and matches everything; see the guard in the verdict step.
              if ! [[ "$BYPASS_SUBJECT" =~ ^[0-9a-f]{64}$ ]]; then
                echo "ERROR: computed subject is not 64 hex digits — refusing to evaluate a bypass"
                echo "  got: [${BYPASS_SUBJECT}]"
                exit 1
              fi

              SHORT="${BYPASS_SUBJECT:0:12}"
              COMMENT_COUNT=$(printf '%s\n' "$BODIES" | wc -l | tr -d ' ')
              echo "Found ${COMMENT_COUNT} 'BYPASS REASON:' comment(s) from ${ADAM_GITHUB_USER}."
              echo "This diff's subject is ${SHORT} — a bypass must name it."

              if printf '%s\n' "$BODIES" | grep -F -q "$SHORT"; then
                echo "✓ a bypass comment names this exact diff subject"
                BYPASS_APPROVED=true
              else
                echo "✗ no bypass comment names this diff — the label alone does not authorise it"
              fi
            else
              echo "✗ No bypass comment from ${ADAM_GITHUB_USER} containing 'BYPASS REASON:'"
            fi
          fi

          echo "bypass_approved=${BYPASS_APPROVED}" >> "$GITHUB_OUTPUT"
          echo "bypass_subject=${BYPASS_SUBJECT}" >> "$GITHUB_OUTPUT"

      # ── Tier floor, from THE classifier ────────────────────────────────────
      # Per the 2026-05-16 board decision #4, .claude/qa-tier-floor.yml sets the
      # MINIMUM risk tier any PR touching those paths must carry. The label check
      # below is the complement — it enforces what the tier map demanded.
      #
      # This step used to contain its own 25-line bash implementation of the glob
      # matching. It is gone. scripts/lib/classifier.js is the only implementation,
      # and scripts/classifier.test.mjs runs it against a path list on every PR.
      #
      # Two defects died with the bash, both found by diffing the two
      # implementations over a 28-path list rather than by reading them:
      #   · an unmatched path classified as `trivial`, though the tier map's own
      #     footer said the default was `lite` — it rated bin/warroom a typo;
      #   · a missing tier map meant "skip", silently classifying everything as
      #     trivial. The classifier now refuses to run with no rules.
      - name: Tier floor from the one classifier
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"

          node scripts/classify.mjs --json --stdin < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/classified.json"
          FLOOR=$(jq -r '.floor.tier' "$RUNNER_TEMP/classified.json")
          FLOOR_FILE=$(jq -r '.floor.file // ""' "$RUNNER_TEMP/classified.json")
          FLOOR_PATTERN=$(jq -r '.floor.pattern // ""' "$RUNNER_TEMP/classified.json")

          echo "Required tier floor: $FLOOR"
          [ -n "$FLOOR_FILE" ] && echo "Reason: $FLOOR_FILE matches $FLOOR_PATTERN"
          jq -r '.files[] | "  \(.tier)\t\(.enforcement)\t\(.file)"' "$RUNNER_TEMP/classified.json"

          # Emit the floor for downstream steps. The label is NO LONGER required (Design B,
          # issue #85). The label is now display-only — cosmetic, not enforcement. The classifier
          # floor IS the enforcement; the next step enforces it directly. A label is a second
          # statement of a fact the classifier already owns, living in GitHub metadata where it
          # drifts silently. PR #78 proved this: the label became wrong mid-review because the
          # diff changed. The next `synchronize` event would have re-computed the correct floor;
          # no human should have had to act on it.
          #
          # If you see a risk:* label on a PR, it is informational only. It is never checked here.
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"

          if [ "$FLOOR" = "full" ]; then
            echo "Floor is 'full' — the session file should declare tier: full|irreversible."
            echo "ADVISORY, not enforced: mechanical enforcement of full-tier sessions is Phase 6."
          fi

      # ── The claim ledger ───────────────────────────────────────────────────
      # Shadow for everything except the ADR-001 carve-outs (migration, deploy,
      # harness self-edit), which block from day one. `verify` exits non-zero only
      # when a claim on an `enforcement: block` path fails; every other failure is
      # written to events.jsonl as claim.would_block and the build stays green.
      #
      # The canary at docs/06-codebase/ledger-canary.md is expected to produce two
      # would_block lines on every single run. Zero would_blocks means the
      # resolvers have stopped firing.
      - name: Claim ledger — resolve every claim
        run: |
          set -euo pipefail
          export WARROOM_EVENTS="$RUNNER_TEMP/events.jsonl"
          node scripts/ledger.mjs verify
          echo ""
          echo "── events.jsonl ──"
          cat "$WARROOM_EVENTS" 2>/dev/null || echo "(no events written)"

      - name: Upload ledger events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-events
          path: ${{ runner.temp }}/events.jsonl
          if-no-files-found: ignore

      # ── Tier-session enforcement (Design B, issue #85) ─────────────────────
      # Per the 2026-05-16 board verdict (decision #3):
      # When the classifier floor is `irreversible`, at least one session file added or
      # modified in this PR must declare `tier: full` or `tier: irreversible`.
      #
      # WHY THE TRIGGER IS THE CLASSIFIER FLOOR, NOT THE LABEL (Design B)
      # The `risk:irreversible` label was a second statement of a fact the classifier
      # already owns — it lived in GitHub metadata where it drifts silently and cannot
      # be tested. PR #78 demonstrated this: the PR opened correctly as `risk:full`, then
      # two `run:` steps were added to ci.yml which raised the floor to `irreversible`.
      # The label became wrong. A human swapped it by hand. A machine reading the
      # classifier at every sync event cannot get that wrong.
      #
      # The label is now display-only. If you see risk:* on a PR, it is informational.
      # Nothing in this file reads it. The classifier floor (from the previous step's
      # GITHUB_OUTPUT) is the only trigger.
      #
      # The "at least one" rule (not "all") was reconciled 2026-08-16: the classifier tiers
      # every docs/** path `trivial`. Requiring `tier: irreversible` on ALL session files
      # meant demanding a false declaration on sessions that honestly described planning work.
      # A gate satisfied only by false declarations teaches people to make them.
      - name: Enforce tier:full|irreversible when classifier floor is irreversible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FLOOR: ${{ steps.classify.outputs.floor }}
        run: |
          set -euo pipefail

          echo "Classifier floor: ${FLOOR}"

          if [ "$FLOOR" != "irreversible" ]; then
            echo "Floor is '${FLOOR}' — session-tier enforcement does not apply."
            exit 0
          fi

          echo "Floor is 'irreversible' — checking session files for tier: full|irreversible"

          # Collect session files added or modified in this PR's diff.
          # F14: use gh api --paginate (gh pr view caps at 100 files).
          CHANGED_SESSIONS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename | select(test("^docs/08-agents_work/sessions/.*\\.md$"))' || echo "")

          if [ -z "$CHANGED_SESSIONS" ]; then
            echo ""
            echo "BLOCKED — classifier floor is 'irreversible' and no session files were added or"
            echo "   modified in this PR's diff."
            echo "   Per 2026-05-16 board decision #3: irreversible-floor work requires at least one"
            echo "   session file declaring tier: full or tier: irreversible."
            exit 1
          fi

          echo "Session files in this PR:"
          echo "$CHANGED_SESSIONS"

          # Build the --sessions argument list.
          SESSION_ARGS=""
          for s in $CHANGED_SESSIONS; do
            SESSION_ARGS="$SESSION_ARGS $s"
          done

          # scripts/check-tier-gate.mjs: exits 0 (PASS) or 1 (BLOCKED).
          # It is the single implementation of "floor=irreversible → session-file tier check."
          # The same logic is unit-tested by `npm run test:tier-gate` in ci.yml.
          # shellcheck disable=SC2086
          node scripts/check-tier-gate.mjs --floor "$FLOOR" --sessions $SESSION_ARGS

      # ── Verdict diff-binding check (PR route) ──────────────────────────────
      # BLOCKS. Promoted out of shadow 2026-08-23 (P0.1): a missing or non-matching
      # verdict now fails the job directly — the shell guard that made this step
      # non-blocking is gone, and nothing has replaced it. The "Check for QA gate
      # bypass" step above no longer grants a PASS on its own; it only computes
      # whether the founder granted an explicit override, which this step reads.
      #
      # Route coverage (explicit, because the gap matters):
      #   · This step covers the PR route (GitHub Actions checkout + push).
      #   · `bin/warroom cmd_merge` covers the local-merge route.
      #   · Neither covers the other — a diff that bypasses CI is not checked here,
      #     and a local merge that never becomes a PR is not checked by CI.
      #
      # ══ WHAT THIS GATE ACTUALLY GUARANTEES ═══════════════════════════════════
      # Measured 2026-08-26 on PR #109 and against the live GitHub API. Every
      # statement below was executed, not read. The honest sentence first:
      #
      #   This job establishes that A FILE NAMED FOR THE sha256 OF THIS DIFF,
      #   SAYING "PASS", IS COMMITTED ON THIS BRANCH. It does not establish that
      #   a review happened, that anyone other than the author produced it, or
      #   that the code below is the code that ran.
      #
      # Everything this job trusts is writable by the PR author: the verdict
      # record, the session file, and this workflow definition. Writing that down
      # is the point — the three measurements that follow are what the sentence
      # costs, and two of them refuted what this file previously asserted.
      #
      # ── 1. Can an author fabricate a passing verdict? YES. Executed. ─────────
      # In a fixture repo, on a diff adding `.github/workflows/evil.yml` and an
      # `eval(process.env.PAYLOAD)`:
      #     verdict.mjs check   → ok:false reason:absent  exit 1   ← control fired
      #     verdict.mjs record --verdict PASS --by qa-lead --evidence "3 reviewers
      #                 PASS, 2 model families"           exit 0
      #     git commit; verdict.mjs check → ok:true tier:irreversible exit 0
      # Two commands, no review, top tier. `by`, `evidence` and `run_id` are
      # recorded and NEVER validated — `check()` reads subject, verdict and tier
      # and nothing else; `run_id: null` passes. Those three fields are audit
      # decoration. Do not read them as provenance.
      #
      # ── 2. Does the PR head's workflow definition run? YES. Reproduced. ──────
      # This was previously asserted here "from GitHub's documented semantics,
      # not a live reproduction". It is now reproduced. PR #109 changed this
      # step's `name:` and the runner reported the CHANGED name:
      #     run 32971785103, step [9]:
      #       "Verdict diff-binding check — blocking; posts an unsigned audit check-run"
      #     the same line on origin/main:
      #       "Verdict diff-binding check — blocking, posted as a signed check-run"
      # A base-definition run could not have produced the first string. So a PR
      # that rewrites this bash to `exit 0` is what executes, still holding the
      # `permissions:` block at the top of this file. Same-repo PRs only —
      # elevated permissions are withheld from FORK PRs, and the worktree
      # protocol pushes straight to `origin`, so the normal flow is the exposed one.
      # Do NOT respond by switching to `pull_request_target`: that runs PR code
      # with the BASE branch's trust and secrets, which is worse than this gap.
      #
      # ── 3. Is the check-run load-bearing? NO. Decorative. ────────────────────
      # `QA verdict (diff-bound)` is NOT in required_status_checks.contexts, and no
      # code anywhere reads that name back — every occurrence in the tree is either an
      # ARGUMENT to the `gh api` call below that CREATES the check-run, or prose (this
      # block included) discussing it.
      #
      # LIST THEM AND LOOK. Do not count, and do not trust a number written here:
      #
      #   grep -rn -F 'QA verdict (diff-bound)' . --exclude-dir=.git \
      #     | grep -Ev ':[0-9]+:[[:space:]]*#'
      #
      # Every surviving line must be a `-f name=` / `-f "output[title]="` argument, or
      # markdown prose. A survivor that READS the name refutes this paragraph.
      #
      # TWICE WRONG HERE, and the second way is the interesting one:
      #   1. "returns only the two lines that create it" — a raw total, true when
      #      written and false in the same commit that wrote it, because the comment
      #      asserting it is itself a match.
      #   2. Its replacement, `| grep -vc '^\s*#'`, LOOKED like it subtracted the prose
      #      and subtracted nothing: `grep -rn` emits `./path:LINENO:content`, so `#` is
      #      never at column 0, the filter matches zero lines, and `-vc` hands back the
      #      unfiltered total — 8 of 8 in this tree, 78 of 78 in a wider scope. It sat
      #      three lines under "state the derivation, never the total", which is why a
      #      derivation is not automatically safer than a number: a WRONG derivation
      #      reports a plausible figure forever and never rots into an obvious error.
      #
      # The filter above is COUPLED TO THE COMMAND'S SHAPE. `grep -rn` gives two colon
      # fields, `grep -n` on a single file gives one, and this pattern silently stops
      # matching comments if you drop the `-r` — measured. Change the command, re-derive
      # the filter, and check it against a line you know it must strip.
      #
      # What gates the merge is this job's exit code under "Verify QA Lead PASS".
      #
      # WORSE, AND THIS IS THE PART THAT CHANGES THE REMEDY: check-runs posted by
      # `gh api` from inside a workflow are attributed to the same app as the ones
      # GitHub Actions creates for real jobs. Measured on PR #108's head:
      #     QA verdict (diff-bound)   app_id=15368  github-actions  success
      #     Verify QA Lead PASS       app_id=15368  github-actions  success
      #     Verify QA Lead PASS       app_id=15368  github-actions  success   ← two, same name
      #     Deterministic checks      app_id=15368  github-actions  success
      # Branch protection pins those contexts to app_id 15368 and resolves a
      # context by NAME, taking the latest check-run bearing it — and two can
      # coexist. So the attack surface is not "this file": ANY workflow added in
      # the PR head can post `Verify QA Lead PASS` = success. Guarding this file
      # alone would guard the wrong thing. (The exploit was NOT executed — that
      # would be an attack on the live gate other lanes are merging through. The
      # attribution and the duplicate-name coexistence above are the executed
      # part; the conclusion from them is analysis.)
      #
      # ── What WOULD close it: repository settings, not files ──────────────────
      # No file in this repo can close 2 or 3, because every file in this repo is
      # in the diff being judged. A control that a PR can edit is not a control
      # over that PR. The remedy is a setting, and the exact ones are:
      #
      #   (a) `.github/CODEOWNERS` naming an owner for `/.github/` + branch
      #       protection `required_pull_request_reviews.require_code_owner_reviews
      #       = true`. Today: the file DOES NOT EXIST and the flag is `false`.
      #       This is the one that matters — it makes any workflow change require
      #       an approval the author cannot give themselves.
      #   (b) `required_pull_request_reviews.required_approving_review_count` is
      #       already `1` (verified 2026-08-26 against a 404 control on an unset
      #       sub-resource, because the parent protection object omits this block
      #       entirely and reading only the parent says "no reviews required").
      #   (c) `enforce_admins` is `false`. This exempts the account that authors
      #       and merges every PR here from (a) and (b) alike, so on this repo's
      #       actual flow the review requirement in (b) does not bind. Setting it
      #       `true` is what makes (a) and (b) real.
      #   (d) `required_pull_request_reviews.require_last_push_approval` is
      #       `false`, so an approval survives a later push. `dismiss_stale_reviews`
      #       is `false` too. Either one would re-bind approval to the diff — the
      #       same property the bypass binding below now enforces for overrides.
      #
      # What the hash on the verdict RECORD still buys, unchanged and worth
      # keeping: a verdict cannot be MOVED onto a different diff and cannot
      # SURVIVE an edit to the diff it approved, and every record has a git author
      # and a revert. Real unforgeability needs a signing key held outside this
      # workflow's own token. That decision has not been made and is not claimed
      # here.
      # The step name said "posted as a signed check-run" until 2026-08-26. Nothing here
      # signs anything. It posts a check-run with the job's own GITHUB_TOKEN, which is
      # authentication of the poster, not a signature over the verdict — and the block
      # above explains why that poster is not a trusted party in this repo's threat
      # model. "Signed" is the exact word that makes a reader stop asking.
      - name: Verdict diff-binding check — blocking; posts an unsigned audit check-run
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BYPASS_APPROVED: ${{ steps.bypass.outputs.bypass_approved }}
          BYPASS_SUBJECT: ${{ steps.bypass.outputs.bypass_subject }}
        run: |
          # `set +e` IS LOAD-BEARING AND WAS MISSING. Measured 2026-08-26: GitHub invokes
          # every `run:` block here as `/usr/bin/bash -e {0}` (read off the runner's own
          # step header), and `set -uo pipefail` does NOT clear an inherited -e. So the
          # comment that stood here — "No -e (unlike the other steps in this job)" —
          # described an intent the runner never honoured.
          #
          # What that cost, measured on run 32964238343: the step printed its header and
          # died at VERDICT_JSON=$(...) the moment verdict.mjs exited 1. No "❌ QA GATE
          # FAILED", no reason, and NO check-run — `check-runs` on that head sha carries
          # only "Verify QA Lead PASS", while a passing head (#108) carries "QA verdict
          # (diff-bound)". The file's claim that "the failing verdict check-run stands
          # for audit" was false, and the entire bypass branch below was DEAD CODE: the
          # only way to survive the assignment was verdict.mjs exiting 0, which exits 0
          # before ever consulting a bypass.
          #
          # A BRANCH THAT HAS NEVER EXECUTED IS A COMMENT, NOT A BRANCH. That is the
          # durable form of this finding, and it is why the bypass logic below was
          # elaborate, reviewed, and worth nothing: nothing had ever run it.
          #
          # Turning it off is what makes the failure path real. What makes THAT safe is
          # that every value the logic below trusts is validated rather than inferred
          # from an exit code — see the guard after the jq block.
          #
          # OBSERVED, not inferred: run 32978261742 drove this path on the runner with a
          # deliberately stale verdict. It printed the JSON, `reason: absent`, the full
          # refusal, and POSTED `QA verdict (diff-bound) = failure` — where the same
          # failure at base (run 32964238343) posted no check-run at all.
          set -uo pipefail
          set +e
          echo "=== Verdict diff-binding check (blocking) ==="

          VERDICT_JSON=$(node scripts/verdict.mjs check --json)
          VERDICT_EXIT=$?
          echo "$VERDICT_JSON"

          if [ -z "$VERDICT_JSON" ]; then
            echo "❌ scripts/verdict.mjs produced no output (exit ${VERDICT_EXIT}) — refusing"
            echo "   rather than treating silence as a pass."
            exit 1
          fi

          OK=$(echo "$VERDICT_JSON" | jq -r '.ok')
          SUBJECT=$(echo "$VERDICT_JSON" | jq -r '.subject')
          TIER=$(echo "$VERDICT_JSON" | jq -r '.tier')
          REASON=$(echo "$VERDICT_JSON" | jq -r '.reason')

          # ── Refuse garbage, not just silence ────────────────────────────────
          # The -z guard above catches an EMPTY verdict; it does not catch a non-empty
          # one that does not parse. Both degenerate the same way: jq exits 0 having
          # printed nothing, every variable becomes "", and an empty SUBJECT fed to a
          # substring match matches ANY comment — granting a bypass while printing
          # "names this exact diff subject ()". A jq shim on $GITHUB_PATH that exits 0
          # with empty output reaches this from inside a PR; jq being ABSENT does not,
          # because that aborts under the -e this step now clears deliberately.
          #
          # So the values are checked, not the exit code. The subject shape is derived
          # from verdict.mjs — sha256 hex digest, 64 lowercase hex digits — and verified
          # by running `verdict.mjs subject` (len=64, matches), not taken on assertion.
          #
          # BOUNDARY, because the paragraph above names a threat and this guard does not
          # close all of it: what is validated is the ANSWER'S SHAPE, never its
          # PROVENANCE. A shim that returns a well-formed 64-hex subject and .ok=true
          # passes here, and the equivalent shim on `node` returns exit 0 at base too.
          # That is the same privilege by one more route to an outcome this repo has
          # already conceded — a PR author can rewrite this workflow — so it adds no
          # exposure. It closes the ACCIDENTAL degeneration, which was reachable and is
          # now not; it does not pretend to close the deliberate one, which needs the
          # repository settings named in the block above this step.
          #
          # The two guards below are SEPARATE ON PURPOSE and were masking each other in
          # test until 2026-08-26: every case drove them with one jq stub, which empties
          # `.ok` and `.subject` together, so whichever guard remained caught the input
          # and deleting either one alone changed nothing. Two guards that mask each
          # other are one guard with a spare. `merge-gate.test.mjs` now isolates them —
          # a well-formed `.ok` with an empty `.subject`, and its mirror.
          if [ "$OK" != "true" ] && [ "$OK" != "false" ]; then
            echo "❌ could not read a boolean .ok from verdict.mjs output (got [${OK}]) — refusing."
            echo "   A gate that cannot read its own oracle does not get to guess."
            exit 1
          fi
          if ! [[ "$SUBJECT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "❌ .subject is not 64 hex digits (got [${SUBJECT}]) — refusing."
            echo "   An unvalidated subject becomes an empty needle, and an empty needle"
            echo "   is found in every haystack."
            exit 1
          fi

          if [ "$OK" = "true" ]; then
            CONCLUSION="success"
            SUMMARY="QA verdict PASS bound to diff subject ${SUBJECT:0:12}… (tier=${TIER})."
          else
            CONCLUSION="failure"
            SUMMARY="No QA verdict bound to this diff (reason=${REASON}, subject=${SUBJECT:0:12}…). Run the tier gate, then node scripts/verdict.mjs record --verdict PASS --by <reviewer>, and commit the record."
          fi

          # Audit artifact, not a control. Measured 2026-08-26: this name is not in
          # required_status_checks.contexts, and `grep -rn "QA verdict (diff-bound)"`
          # over the whole tree returns only the two lines below — it is written here
          # and read nowhere. What gates the merge is this job's EXIT CODE, surfaced
          # under the required context "Verify QA Lead PASS".
          echo "Posting audit check-run (conclusion=${CONCLUSION})..."
          if ! gh api "repos/${REPO}/check-runs" \
            -f name="QA verdict (diff-bound)" \
            -f head_sha="${HEAD_SHA}" \
            -f status="completed" \
            -f conclusion="${CONCLUSION}" \
            -f "output[title]=QA verdict (diff-bound)" \
            -f "output[summary]=${SUMMARY}" \
            > /dev/null; then
            echo "⚠️  Failed to post the check-run (continuing — the exit code below still gates the job)."
          fi

          if [ "$OK" = "true" ]; then
            echo ""
            echo "✅ QA GATE PASSED — a verdict record naming this diff's subject is committed"
            echo "   on this branch. That is the whole claim: see the block above this step for"
            echo "   what it does and does not establish. It is not a signature and not proof"
            echo "   that a review happened."
            exit 0
          fi

          # ── The override, bound to the diff it overrides ────────────────────
          # A bypass now has to name the subject it is bypassing. Enumerate what the
          # old predicate admitted and this one does not, because a deletion attracts
          # no test cases:
          #
          #   ADMITTED BEFORE, REFUSED NOW — a "BYPASS REASON:" comment naming no
          #   subject. It authorised the diff present when it was written AND every
          #   diff pushed to that PR afterwards, without limit, because the label is
          #   sticky and the comment is immutable. Nothing recomputed on `synchronize`.
          #   Who needed that? Nobody: the founder reads the failing check-run to
          #   decide, and the failing check-run has always printed the subject. The
          #   cost of the new rule is pasting 12 characters that are already on screen.
          #
          #   STILL ADMITTED — a comment carrying the full 64-char subject, since the
          #   full subject contains its own 12-char prefix. One predicate, both forms.
          #
          # 12 hex characters is 48 bits. That is not a cryptographic claim and does
          # not need to be: the founder is trusted here by construction, and the
          # binding exists to pin WHICH DIFF they meant, not to resist them.
          #
          # The DECISION arrives as a boolean on an immutable step output; the evidence
          # for it never crosses the gap. All this step does is confirm the decision was
          # taken against the same diff this step is judging — two invocations of one
          # implementation, four steps apart, over a tree that must not have moved.
          if [ "$BYPASS_APPROVED" = "true" ]; then
            if [ "$BYPASS_SUBJECT" != "$SUBJECT" ]; then
              echo ""
              echo "❌ BYPASS REFUSED — the bypass was approved against subject"
              echo "   [${BYPASS_SUBJECT}] but this step is judging [${SUBJECT}]."
              echo "   One implementation computed both, so a mismatch means the tree moved"
              echo "   mid-job. Refusing rather than picking one."
              exit 1
            fi
            echo ""
            echo "⚠️  QA GATE BYPASSED — a founder comment carries 'BYPASS REASON:' AND names"
            echo "    this exact diff subject (${SUBJECT:0:12})."
            echo "    The failing verdict check-run posted above stands for audit."
            echo "    Note: audit_log rule_violation row will be written by Inngest on next cycle"
            exit 0
          fi

          echo ""
          echo "❌ QA GATE FAILED — ${SUMMARY}"
          echo ""
          echo "To pass this check, ONE of the following must be true:"
          echo ""
          echo "  1. A QA verdict bound to this PR's exact diff, recorded via"
          echo "     node scripts/verdict.mjs record --verdict PASS --by <reviewer> ..."
          echo "     and committed under .qa/verdicts/."
          echo ""
          echo "  2. The PR must have the 'qa-lead-bypass' label AND a comment from the"
          echo "     authorized user containing BOTH 'BYPASS REASON:' and this diff's"
          echo "     subject — a bypass is bound to the diff it bypasses, exactly as a"
          echo "     verdict is. Copy this line:"
          echo ""
          echo "       BYPASS REASON: <why> ${SUBJECT:0:12}"
          echo ""
          echo "     Then RE-RUN THIS JOB. Posting a comment triggers nothing: the"
          echo "     triggers are [opened, synchronize, reopened, labeled, unlabeled],"
          echo "     so with the label already applied, toggle it off and on (or use"
          echo "     'Re-run jobs'). This did not matter under the old rule, which was"
          echo "     diff-independent and so could be evaluated before the comment existed."
          exit 1
