# POSTURE: BLOCKS. Promoted from shadow to blocking in Phase 3, 2026-08-11.
#
# It ran in shadow for the whole of Phases 1 and 2 — computing the full verdict,
# printing `[shadow] WOULD BLOCK`, and failing nothing. That was the right way to
# start: every gate ships in shadow first so the friction is measured rather than
# guessed. But a gate that never blocks is not a gate, and shadow mode with no
# promotion criterion is just a disabled check with better manners.
#
# THE EVIDENCE THAT PROMOTED IT. Across every PR of Phases 1 and 2 the shadow
# verdict was correct each time and never once demanded ceremony that was not
# already being done — the session file with `qa_verdict: PASS` is written for
# every task anyway, because CLAUDE.md's documentation gate requires it. The
# friction it adds is therefore zero, which is the only honest reason to promote a
# rule to blocking.
#
# What it enforces:
#   1. A QA verdict bound to THIS PR'S EXACT DIFF (scripts/verdict.mjs), posted as a
#      check-run signed by this workflow's own GITHUB_TOKEN — or the founder posted
#      an explicit `BYPASS REASON:` comment under a bypass label.
#      (Grepping session files for `qa_verdict: PASS` was removed 2026-08-23 (P0.1) —
#      that trusted PR-author-authored prose as if it were review output. Before that,
#      slug matching against the whole sessions directory was removed 2026-08-15 — it
#      let a branch inherit a PASS written for work already merged to main.)
#   2. When the classifier floor is `irreversible`, at least one session file in this
#      PR declares `tier: full` or `tier: irreversible`.
#
# NOTE: The `risk:*` label is NO LONGER REQUIRED (Design B, issue #85, 2026-08-17).
# It is display-only — cosmetic metadata the founder can apply for visibility, but
# nothing here reads it. The classifier floor IS the enforcement. A label was a
# second statement of a fact the classifier already owns; it drifted silently. PR #78
# proved this when two `run:` steps raised the floor mid-review and the label became
# wrong. The next `synchronize` event recomputes the correct floor; a stored label does
# not update itself.
#
# The tier floor comes from scripts/classify.mjs — the ONE classifier. The 25 lines
# of bash that used to reimplement that matching inline are gone; two
# implementations of risk classification will disagree, and you find out during the
# incident. The label check was a third implementation. It is gone too.
#
# Making this a REQUIRED check in branch protection is a repository setting, not a
# file, and is the founder's call. Until it is required, a failure here is visible
# and red but does not physically prevent a merge.
name: QA Lead Pass

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: read   # F12: Required for gh api repos/$REPO/issues/$PR_NUMBER/comments (bypass comment check)
  checks: write  # Required to post the diff-bound verdict as a check-run signed by this
                 # workflow's own GITHUB_TOKEN — a PR author can write any line into a file
                 # they author, but cannot mint a check-run without this token.

jobs:
  qa-gate:
    name: Verify QA Lead PASS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for QA gate bypass
        id: bypass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ADAM_GITHUB_USER: ${{ vars.ADAM_GITHUB_USER }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== QA gate bypass check for PR #${PR_NUMBER} ==="
          echo "The pass/fail decision is made by the 'Verdict diff-binding check' step"
          echo "below, which reads a diff-bound verdict signed onto a GitHub check-run —"
          echo "not by grepping session file content, which a PR author can write to say"
          echo "anything. This step only checks whether the founder granted an explicit"
          echo "bypass."

          # ── Bypass label ──────────────────────────────────────────────────
          HAS_BYPASS_LABEL=$(gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json labels \
            --jq '[.labels[].name] | contains(["qa-lead-bypass"])')

          echo "Has qa-lead-bypass label: ${HAS_BYPASS_LABEL}"

          # ── Bypass label present → require Adam's bypass comment ───────────
          BYPASS_APPROVED=false
          if [ "$HAS_BYPASS_LABEL" = "true" ]; then
            if [ -z "$ADAM_GITHUB_USER" ]; then
              echo "ERROR: ADAM_GITHUB_USER variable is not set — cannot validate bypass author"
              exit 1
            fi

            # Look for a comment from Adam containing BYPASS REASON:
            BYPASS_COMMENT=$(gh api \
              "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"$ADAM_GITHUB_USER\") | select(.body | test(\"BYPASS REASON:\")) | .id" \
              | head -1)

            if [ -n "$BYPASS_COMMENT" ]; then
              echo "✓ Bypass comment found from ${ADAM_GITHUB_USER} (comment ID: ${BYPASS_COMMENT})"
              BYPASS_APPROVED=true
            else
              echo "✗ No bypass comment from ${ADAM_GITHUB_USER} containing 'BYPASS REASON:'"
            fi
          fi

          echo "bypass_approved=${BYPASS_APPROVED}" >> "$GITHUB_OUTPUT"

      # ── Tier floor, from THE classifier ────────────────────────────────────
      # Per the 2026-05-16 board decision #4, .claude/qa-tier-floor.yml sets the
      # MINIMUM risk tier any PR touching those paths must carry. The label check
      # below is the complement — it enforces what the tier map demanded.
      #
      # This step used to contain its own 25-line bash implementation of the glob
      # matching. It is gone. scripts/lib/classifier.js is the only implementation,
      # and scripts/classifier.test.mjs runs it against a path list on every PR.
      #
      # Two defects died with the bash, both found by diffing the two
      # implementations over a 28-path list rather than by reading them:
      #   · an unmatched path classified as `trivial`, though the tier map's own
      #     footer said the default was `lite` — it rated bin/warroom a typo;
      #   · a missing tier map meant "skip", silently classifying everything as
      #     trivial. The classifier now refuses to run with no rules.
      - name: Tier floor from the one classifier
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          echo "Changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"

          node scripts/classify.mjs --json --stdin < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/classified.json"
          FLOOR=$(jq -r '.floor.tier' "$RUNNER_TEMP/classified.json")
          FLOOR_FILE=$(jq -r '.floor.file // ""' "$RUNNER_TEMP/classified.json")
          FLOOR_PATTERN=$(jq -r '.floor.pattern // ""' "$RUNNER_TEMP/classified.json")

          echo "Required tier floor: $FLOOR"
          [ -n "$FLOOR_FILE" ] && echo "Reason: $FLOOR_FILE matches $FLOOR_PATTERN"
          jq -r '.files[] | "  \(.tier)\t\(.enforcement)\t\(.file)"' "$RUNNER_TEMP/classified.json"

          # Emit the floor for downstream steps. The label is NO LONGER required (Design B,
          # issue #85). The label is now display-only — cosmetic, not enforcement. The classifier
          # floor IS the enforcement; the next step enforces it directly. A label is a second
          # statement of a fact the classifier already owns, living in GitHub metadata where it
          # drifts silently. PR #78 proved this: the label became wrong mid-review because the
          # diff changed. The next `synchronize` event would have re-computed the correct floor;
          # no human should have had to act on it.
          #
          # If you see a risk:* label on a PR, it is informational only. It is never checked here.
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"

          if [ "$FLOOR" = "full" ]; then
            echo "Floor is 'full' — the session file should declare tier: full|irreversible."
            echo "ADVISORY, not enforced: mechanical enforcement of full-tier sessions is Phase 6."
          fi

      # ── The claim ledger ───────────────────────────────────────────────────
      # Shadow for everything except the ADR-001 carve-outs (migration, deploy,
      # harness self-edit), which block from day one. `verify` exits non-zero only
      # when a claim on an `enforcement: block` path fails; every other failure is
      # written to events.jsonl as claim.would_block and the build stays green.
      #
      # The canary at docs/06-codebase/ledger-canary.md is expected to produce two
      # would_block lines on every single run. Zero would_blocks means the
      # resolvers have stopped firing.
      - name: Claim ledger — resolve every claim
        run: |
          set -euo pipefail
          export WARROOM_EVENTS="$RUNNER_TEMP/events.jsonl"
          node scripts/ledger.mjs verify
          echo ""
          echo "── events.jsonl ──"
          cat "$WARROOM_EVENTS" 2>/dev/null || echo "(no events written)"

      - name: Upload ledger events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-events
          path: ${{ runner.temp }}/events.jsonl
          if-no-files-found: ignore

      # ── Tier-session enforcement (Design B, issue #85) ─────────────────────
      # Per the 2026-05-16 board verdict (decision #3):
      # When the classifier floor is `irreversible`, at least one session file added or
      # modified in this PR must declare `tier: full` or `tier: irreversible`.
      #
      # WHY THE TRIGGER IS THE CLASSIFIER FLOOR, NOT THE LABEL (Design B)
      # The `risk:irreversible` label was a second statement of a fact the classifier
      # already owns — it lived in GitHub metadata where it drifts silently and cannot
      # be tested. PR #78 demonstrated this: the PR opened correctly as `risk:full`, then
      # two `run:` steps were added to ci.yml which raised the floor to `irreversible`.
      # The label became wrong. A human swapped it by hand. A machine reading the
      # classifier at every sync event cannot get that wrong.
      #
      # The label is now display-only. If you see risk:* on a PR, it is informational.
      # Nothing in this file reads it. The classifier floor (from the previous step's
      # GITHUB_OUTPUT) is the only trigger.
      #
      # The "at least one" rule (not "all") was reconciled 2026-08-16: the classifier tiers
      # every docs/** path `trivial`. Requiring `tier: irreversible` on ALL session files
      # meant demanding a false declaration on sessions that honestly described planning work.
      # A gate satisfied only by false declarations teaches people to make them.
      - name: Enforce tier:full|irreversible when classifier floor is irreversible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FLOOR: ${{ steps.classify.outputs.floor }}
        run: |
          set -euo pipefail

          echo "Classifier floor: ${FLOOR}"

          if [ "$FLOOR" != "irreversible" ]; then
            echo "Floor is '${FLOOR}' — session-tier enforcement does not apply."
            exit 0
          fi

          echo "Floor is 'irreversible' — checking session files for tier: full|irreversible"

          # Collect session files added or modified in this PR's diff.
          # F14: use gh api --paginate (gh pr view caps at 100 files).
          CHANGED_SESSIONS=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[].filename | select(test("^docs/08-agents_work/sessions/.*\\.md$"))' || echo "")

          if [ -z "$CHANGED_SESSIONS" ]; then
            echo ""
            echo "BLOCKED — classifier floor is 'irreversible' and no session files were added or"
            echo "   modified in this PR's diff."
            echo "   Per 2026-05-16 board decision #3: irreversible-floor work requires at least one"
            echo "   session file declaring tier: full or tier: irreversible."
            exit 1
          fi

          echo "Session files in this PR:"
          echo "$CHANGED_SESSIONS"

          # Build the --sessions argument list.
          SESSION_ARGS=""
          for s in $CHANGED_SESSIONS; do
            SESSION_ARGS="$SESSION_ARGS $s"
          done

          # scripts/check-tier-gate.mjs: exits 0 (PASS) or 1 (BLOCKED).
          # It is the single implementation of "floor=irreversible → session-file tier check."
          # The same logic is unit-tested by `npm run test:tier-gate` in ci.yml.
          # shellcheck disable=SC2086
          node scripts/check-tier-gate.mjs --floor "$FLOOR" --sessions $SESSION_ARGS

      # ── Verdict diff-binding check (PR route) ──────────────────────────────
      # BLOCKS. Promoted out of shadow 2026-08-23 (P0.1): a missing or non-matching
      # verdict now fails the job directly — the shell guard that made this step
      # non-blocking is gone, and nothing has replaced it. The "Check for QA gate
      # bypass" step above no longer grants a PASS on its own; it only computes
      # whether the founder granted an explicit override, which this step reads.
      #
      # Route coverage (explicit, because the gap matters):
      #   · This step covers the PR route (GitHub Actions checkout + push).
      #   · `bin/warroom cmd_merge` covers the local-merge route.
      #   · Neither covers the other — a diff that bypasses CI is not checked here,
      #     and a local merge that never becomes a PR is not checked by CI.
      #
      # Binding model:
      #   The verdict RECORD is hash-bound, not signed — anyone with repo-write
      #   access can author a `.qa/verdicts/*.json` file. What IS signed is the
      #   check-run posted below: it is created with this workflow's own
      #   GITHUB_TOKEN, over the `checks: write` permission declared at the top of
      #   this file. A PR author can write any line they like into a file they
      #   author; they cannot mint a check-run without that token. The hash still
      #   guarantees a verdict cannot be moved onto a different diff and cannot
      #   survive an unreviewed edit to the diff it approved — it does not prove
      #   who authored the underlying record. Real unforgeability of the record
      #   itself needs a signing key; that decision has not been made and is not
      #   claimed here.
      - name: Verdict diff-binding check — blocking, posted as a signed check-run
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BYPASS_APPROVED: ${{ steps.bypass.outputs.bypass_approved }}
        run: |
          set -uo pipefail
          echo "=== Verdict diff-binding check (blocking) ==="

          VERDICT_JSON=$(node scripts/verdict.mjs check --json)
          VERDICT_EXIT=$?
          echo "$VERDICT_JSON"

          if [ -z "$VERDICT_JSON" ]; then
            echo "❌ scripts/verdict.mjs produced no output (exit ${VERDICT_EXIT}) — refusing"
            echo "   rather than treating silence as a pass."
            exit 1
          fi

          OK=$(echo "$VERDICT_JSON" | jq -r '.ok')
          SUBJECT=$(echo "$VERDICT_JSON" | jq -r '.subject')
          TIER=$(echo "$VERDICT_JSON" | jq -r '.tier')
          REASON=$(echo "$VERDICT_JSON" | jq -r '.reason')

          if [ "$OK" = "true" ]; then
            CONCLUSION="success"
            SUMMARY="QA verdict PASS bound to diff subject ${SUBJECT:0:12}… (tier=${TIER})."
          else
            CONCLUSION="failure"
            SUMMARY="No QA verdict bound to this diff (reason=${REASON}, subject=${SUBJECT:0:12}…). Run the tier gate, then node scripts/verdict.mjs record --verdict PASS --by <reviewer>, and commit the record."
          fi

          echo "Posting signed check-run (conclusion=${CONCLUSION})..."
          if ! gh api "repos/${REPO}/check-runs" \
            -f name="QA verdict (diff-bound)" \
            -f head_sha="${HEAD_SHA}" \
            -f status="completed" \
            -f conclusion="${CONCLUSION}" \
            -f "output[title]=QA verdict (diff-bound)" \
            -f "output[summary]=${SUMMARY}" \
            > /dev/null; then
            echo "⚠️  Failed to post the check-run (continuing — the exit code below still gates the job)."
          fi

          if [ "$OK" = "true" ]; then
            echo ""
            echo "✅ QA GATE PASSED — verdict signed and bound to this diff."
            exit 0
          fi

          if [ "$BYPASS_APPROVED" = "true" ]; then
            echo ""
            echo "⚠️  QA GATE BYPASSED — bypass label + Adam comment with BYPASS REASON: present."
            echo "    The failing verdict check-run above stands for audit; it is not overwritten."
            echo "    Note: audit_log rule_violation row will be written by Inngest on next cycle"
            exit 0
          fi

          echo ""
          echo "❌ QA GATE FAILED — ${SUMMARY}"
          echo ""
          echo "To pass this check, ONE of the following must be true:"
          echo ""
          echo "  1. A QA verdict bound to this PR's exact diff, recorded via"
          echo "     node scripts/verdict.mjs record --verdict PASS --by <reviewer> ..."
          echo "     and committed under .qa/verdicts/."
          echo ""
          echo "  2. The PR must have the 'qa-lead-bypass' label AND a comment from"
          echo "     the authorized user containing 'BYPASS REASON:'"
          exit 1
