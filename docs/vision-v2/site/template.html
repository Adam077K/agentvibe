<title>Agentvibe v2 Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#f3f5f3; --surface:#ffffff; --sunk:#e9eeeb; --ink:#18211e; --muted:#5a6863; --faint:#8a9792;
  --rule:#d8e0dc; --accent:#0e6b5f; --accent-soft:#d9ece7; --warn:#9a5b0c; --warn-soft:#f6ead8;
  --code:#eef2f0;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513; --surface:#171e1b; --sunk:#1d2522; --ink:#e4ebe8; --muted:#9fb0a9; --faint:#74847e;
    --rule:#2a3531; --accent:#56c4ad; --accent-soft:#1c3a33; --warn:#e3a55a; --warn-soft:#3a2c19; --code:#1f2825;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513; --surface:#171e1b; --sunk:#1d2522; --ink:#e4ebe8; --muted:#9fb0a9; --faint:#74847e;
  --rule:#2a3531; --accent:#56c4ad; --accent-soft:#1c3a33; --warn:#e3a55a; --warn-soft:#3a2c19; --code:#1f2825;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding-inline:16px}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.app{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 200px;grid-template-areas:"mast mast mast" "rail canvas toc";gap:0 40px;padding-block:20px 60px}
.masthead{grid-area:mast;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--rule);margin-bottom:24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.mast-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.kicker{font:600 22px/1.2 var(--serif);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.kicker span{color:var(--accent)}
.statusline{font:12px/1.4 var(--mono);color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 320px;justify-content:flex-end;min-width:0}
.searchbox{position:relative;flex:1 1 280px;max-width:420px;min-width:0}
#q{width:100%;font:15px var(--sans);padding:8px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:8px 10px;border-radius:4px;cursor:pointer;font:14px/1.4 var(--sans)}
.results button:hover,.results button.sel{background:var(--accent-soft)}
.results .doc{font:11px/1.3 var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.results mark{background:var(--warn-soft);color:inherit;padding:0 1px}
.results .none{padding:10px;color:var(--muted);font-size:14px}
.ghost{font:13px var(--sans);background:none;border:1px solid var(--rule);color:var(--muted);padding:7px 10px;border-radius:6px;cursor:pointer}
.caveat{flex-basis:100%;font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px}
.rail{grid-area:rail;position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
.rail h2{font:600 11px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:18px 0 6px}
.rail h2:first-child{margin-top:0}
.rail a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:14.5px;line-height:1.35;padding:5px 8px;border-radius:5px}
.rail a .n{font:11px var(--mono);color:var(--faint);min-width:2.2em}
.rail a:hover{color:var(--ink);background:var(--sunk)}
.rail a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.rail a[aria-current="page"] .n{color:var(--accent)}
.railselect{display:none}
.canvas{grid-area:canvas;min-width:0}
.toc{grid-area:toc;position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;font-size:13px}
.toc h2{font:600 11px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 8px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:3px 0 3px 10px;border-left:2px solid var(--rule);line-height:1.35}
.toc a:hover{color:var(--ink);border-color:var(--accent)}
.toc a.h3{padding-left:20px;font-size:12.5px}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 28px}
.glance div{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.glance b{display:block;font:600 28px/1.1 var(--serif);color:var(--accent);font-variant-numeric:tabular-nums}
.glance span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:4px}
.docmeta{font:12px/1.4 var(--mono);color:var(--faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.md{max-width:78ch}
.md h1{font:600 clamp(26px,3.4vw,36px)/1.15 var(--serif);letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}
.md h2{font:600 22px/1.25 var(--serif);margin:36px 0 12px;padding-top:12px;border-top:1px solid var(--rule);text-wrap:balance}
.md h3{font:600 17px/1.3 var(--sans);margin:26px 0 8px}
.md h4{font:600 15px/1.3 var(--sans);margin:20px 0 6px;color:var(--muted)}
.md p,.md li{max-width:72ch}
.md ul,.md ol{padding-left:1.3em}
.md li{margin:4px 0}
.md strong{font-weight:600}
.md code{font:0.86em var(--mono);background:var(--code);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.md pre{background:var(--code);border-radius:6px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0;overflow-wrap:normal}
.md blockquote{margin:14px 0;padding:6px 14px;border-left:3px solid var(--accent);color:var(--muted);background:var(--surface)}
.md hr{border:0;border-top:1px solid var(--rule);margin:28px 0}
.tablewrap{overflow-x:auto;margin:14px 0 20px;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
.md table{border-collapse:collapse;font-size:14px;line-height:1.45;min-width:100%}
.md th{font:600 12px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;background:var(--sunk);position:sticky;top:0}
.md th,.md td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.md tr:last-child td{border-bottom:0}
.md td:first-child{white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);max-width:78ch;flex-wrap:wrap}
.pager a{text-decoration:none;font-size:14px;color:var(--muted)}
.pager a b{display:block;color:var(--ink);font-weight:600}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--warn-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
@media (max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr);grid-template-areas:"mast mast" "rail canvas"}.toc{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"mast" "rail" "canvas"}
  .rail{position:static;max-height:none}
  .rail nav{display:none}
  .railselect{display:block;width:100%;font:15px var(--sans);padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);margin-bottom:18px}
  .masthead{position:static}
  .md td:first-child{white-space:normal}
}
</style>

<div class="app">
  <header class="masthead">
    <div class="mast-id">
      <a class="kicker" href="#readme">Agentvibe <span>v2</span> Explorer</a>
      <div class="statusline" id="statusline"></div>
    </div>
    <div class="tools">
      <div class="searchbox">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search all documents" aria-label="Search all documents">
        <div class="results" id="results" hidden></div>
      </div>
      <button id="themebtn" class="ghost" type="button" title="Switch light and dark">Theme</button>
    </div>
    <div class="caveat">Proposal, not yet approved. Written in one pass on 2026-09-29 by a single model family. Four outside reviews say: keep the runner, start a venture now, and fix eight must-fix findings first. Replaces S1.1 once the founder answers D12, D1, D2 and D9.</div>
  </header>
  <aside class="rail" aria-label="Documents">
    <select class="railselect" id="railselect" aria-label="Choose a document"></select>
    <nav id="rail"></nav>
  </aside>
  <main class="canvas" id="canvas" tabindex="-1"></main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var DOCS = DATA.docs, byId = {}, byFile = {};
  DOCS.forEach(function(d){ byId[d.id]=d; byFile[d.file]=d; });
  var rail = document.getElementById('rail'), sel = document.getElementById('railselect');
  var canvas = document.getElementById('canvas'), toc = document.getElementById('toc');
  document.getElementById('statusline').textContent = 'branch ' + DATA.branch + ' · ' + DATA.commit + ' · ' + DATA.date + ' · ' + DOCS.length + ' documents · ' + Math.round(DATA.bytes/1024) + ' KB';

  // Rail
  var groups = [];
  DOCS.forEach(function(d){ var g = groups.find(function(x){return x.name===d.group}); if(!g){g={name:d.group,docs:[]};groups.push(g);} g.docs.push(d); });
  groups.forEach(function(g){
    var h = document.createElement('h2'); h.textContent = g.name; rail.appendChild(h);
    var og = document.createElement('optgroup'); og.label = g.name; sel.appendChild(og);
    g.docs.forEach(function(d){
      var a = document.createElement('a'); a.href = '#' + d.id; a.dataset.id = d.id;
      a.innerHTML = '<span class="n"></span><span></span>';
      a.firstChild.textContent = d.num; a.lastChild.textContent = d.title; rail.appendChild(a);
      var o = document.createElement('option'); o.value = d.id; o.textContent = (d.num ? d.num + '  ' : '') + d.title; og.appendChild(o);
    });
  });
  sel.addEventListener('change', function(){ location.hash = sel.value; });

  function slug(s){ return s.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }

  function render(id, anchorText){
    var d = byId[id] || byId.readme;
    document.querySelectorAll('.rail a').forEach(function(a){ a.toggleAttribute('aria-current', a.dataset.id===d.id); if(a.dataset.id===d.id) a.setAttribute('aria-current','page'); });
    sel.value = d.id;
    var html = (window.marked ? marked.parse(d.md, {gfm:true}) : '<pre>' + d.md.replace(/[&<]/g, function(c){return c==='&'?'&amp;':'&lt;'}) + '</pre>');
    canvas.innerHTML = '';
    var meta = document.createElement('div'); meta.className = 'docmeta'; meta.textContent = d.group + ' · ' + d.path + ' · ' + (d.bytes/1024).toFixed(1) + ' KB';
    canvas.appendChild(meta);
    if (d.id === 'readme') canvas.appendChild(glance());
    var body = document.createElement('article'); body.className = 'md'; body.innerHTML = html; canvas.appendChild(body);
    body.querySelectorAll('table').forEach(function(t){ var w = document.createElement('div'); w.className='tablewrap'; t.parentNode.insertBefore(w,t); w.appendChild(t); });
    body.querySelectorAll('a[href]').forEach(function(a){
      var href = a.getAttribute('href');
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var f = href.split('#')[0].replace(/^\.\//,'').replace(/^panel\//,'panel/');
      var target = byFile[f] || byFile[f.replace(/^.*\//,'')];
      if (f === 'panel/' || f === 'panel') target = byId['p01'];
      if (target) a.href = '#' + target.id; else { a.removeAttribute('href'); a.title = 'Not included in this explorer: ' + href; }
    });
    // TOC
    toc.innerHTML = '';
    var hs = body.querySelectorAll('h2,h3');
    if (hs.length > 1) {
      var t = document.createElement('h2'); t.textContent = 'On this page'; toc.appendChild(t);
      hs.forEach(function(h, i){ h.id = 'h-' + i + '-' + slug(h.textContent);
        var a = document.createElement('a'); a.href = '#' + d.id; a.textContent = h.textContent; a.className = h.tagName.toLowerCase();
        a.addEventListener('click', function(e){ e.preventDefault(); h.scrollIntoView({behavior: reduce() ? 'auto':'smooth', block:'start'}); });
        toc.appendChild(a); });
    }
    // Pager
    var i = DOCS.indexOf(d), pg = document.createElement('nav'); pg.className = 'pager';
    if (i > 0) pg.appendChild(pagerLink(DOCS[i-1], 'Previous')); else pg.appendChild(document.createElement('span'));
    if (i < DOCS.length-1) pg.appendChild(pagerLink(DOCS[i+1], 'Next'));
    canvas.appendChild(pg);
    if (anchorText) { jumpTo(body, anchorText); } else { window.scrollTo(0,0); }
  }
  function pagerLink(d, label){ var a = document.createElement('a'); a.href = '#' + d.id; a.innerHTML = label + '<b></b>'; a.lastChild.textContent = d.title; if(label==='Next') a.style.textAlign='right'; return a; }
  function reduce(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function jumpTo(body, text){
    var needle = text.toLowerCase(), best = null;
    body.querySelectorAll('h1,h2,h3,h4,p,li,td,th,blockquote').forEach(function(el){ if(!best && el.textContent.toLowerCase().indexOf(needle) !== -1) best = el; });
    if (best) { best.scrollIntoView({block:'center'}); best.classList.add('flash'); setTimeout(function(){ best.classList.remove('flash'); }, 1700); }
  }
  function glance(){
    var g = document.createElement('div'); g.className = 'glance';
    DATA.glance.forEach(function(x){ var c = document.createElement('div'); c.innerHTML = '<b></b><span></span>'; c.firstChild.textContent = x[0]; c.lastChild.textContent = x[1]; g.appendChild(c); });
    return g;
  }

  // Search
  var q = document.getElementById('q'), res = document.getElementById('results'), selIdx = -1, hits = [];
  var plain = DOCS.map(function(d){ return d.md.split('\n').map(function(l){ return l.replace(/[#*`>|_\[\]]/g,' ').replace(/\(([^)]*\.md[^)]*)\)/g,'').replace(/\s+/g,' ').trim(); }); });
  function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function search(term){
    hits = []; var t = term.toLowerCase();
    if (t.length < 2) { res.hidden = true; return; }
    DOCS.forEach(function(d, di){
      if (d.title.toLowerCase().indexOf(t) !== -1) hits.push({d:d, line:d.title, anchor:''});
      plain[di].forEach(function(l){ if (l && l.toLowerCase().indexOf(t) !== -1 && hits.length < 60) hits.push({d:d, line:l, anchor:term}); });
    });
    res.innerHTML = '';
    if (!hits.length) { res.innerHTML = '<div class="none">No matches for “' + esc(term) + '”.</div>'; res.hidden = false; return; }
    hits.slice(0,40).forEach(function(h, i){
      var b = document.createElement('button'); b.type = 'button';
      var at = h.line.toLowerCase().indexOf(t), start = Math.max(0, at - 50), snip = h.line.slice(start, at + t.length + 90);
      var k = snip.toLowerCase().indexOf(t);
      b.innerHTML = '<span class="doc">' + esc(h.d.title) + '</span>' + (start>0?'…':'') + esc(snip.slice(0,k)) + '<mark>' + esc(snip.slice(k,k+t.length)) + '</mark>' + esc(snip.slice(k+t.length));
      b.addEventListener('click', function(){ go(h); });
      res.appendChild(b);
    });
    selIdx = -1; res.hidden = false;
  }
  function go(h){ res.hidden = true; q.blur(); if (location.hash.slice(1) === h.d.id) render(h.d.id, h.anchor); else { pendingAnchor = h.anchor; location.hash = h.d.id; } }
  var pendingAnchor = '';
  q.addEventListener('input', function(){ search(q.value.trim()); });
  q.addEventListener('keydown', function(e){
    var bs = res.querySelectorAll('button'); if (!bs.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); selIdx = (selIdx + (e.key==='ArrowDown'?1:-1) + bs.length) % bs.length; bs.forEach(function(b,i){ b.classList.toggle('sel', i===selIdx); }); bs[selIdx].scrollIntoView({block:'nearest'}); }
    if (e.key === 'Enter') { e.preventDefault(); go(hits[selIdx < 0 ? 0 : selIdx]); }
    if (e.key === 'Escape') { res.hidden = true; }
  });
  document.addEventListener('click', function(e){ if (!e.target.closest('.searchbox')) res.hidden = true; });
  document.addEventListener('keydown', function(e){ if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });

  // Theme
  var root = document.documentElement;
  try { var saved = localStorage.getItem('v2x-theme'); if (saved) root.setAttribute('data-theme', saved); } catch(e) {}
  document.getElementById('themebtn').addEventListener('click', function(){
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', next);
    try { localStorage.setItem('v2x-theme', next); } catch(e) {}
  });

  function route(){ var id = location.hash.slice(1); render(byId[id] ? id : 'readme', pendingAnchor); pendingAnchor = ''; }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
