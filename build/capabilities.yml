# build/capabilities.yml — destination capabilities named by 14-BUILD-PLAN.md, and the jobs
# in build/jobs.yml that deliver each one.
#
# Source (never invented beyond what these two passages enumerate):
#  - 14-BUILD-PLAN.md:67 — "the register lint fails if any destination capability in
#    03-09b, 16 or 17 has no job." The ten entries below are exactly the ten owning files
#    named in §5's lane table (the "Scope (owning file)" column) for that range: 03, 04,
#    05, 06, 07, 08, 09a, 09b, 16, 17. 09b is jointly owned by three lanes; every other
#    file has one owning lane. `delivering_jobs` is computed from build/jobs.yml's own
#    `lane` field, not hand-picked.
#  - 14-BUILD-PLAN.md:436-444 — the "After Year 1 (triggered, never dropped)" list of six
#    items, each "already a row in the register, marked `trigger:` instead of a week." The
#    plan gives these no job id inside the P0-P5 register (they are explicitly after Year
#    1, outside P0-P5), so `delivering_jobs` is deliberately empty — build/lint-jobs.mjs
#    treats a `trigger: true` capability's empty list as by design, never as the gap the
#    "no job" rule refuses for every other capability.
#
# Run: node build/lint-jobs.mjs (not an npm script — see build/jobs.yml's own header).

