# build/jobs.yml — the Build Register (14-BUILD-PLAN.md §6), as data.
#
# Generated from docs/vision-v3/14-BUILD-PLAN.md §6 job tables (P0-P5), one row per job,
# by a throwaway parser (not hand-typed). Linted by build/lint-jobs.mjs (`npm run lint:jobs`).
#
# Field notes:
#  - depends_on: job ids, normalised from the plan's short forms within their own phase context;
#    a dependency on a split parent (e.g. B1-16) expands to both halves (B1-16a, B1-16b).
#  - founder_deps: non-job founder decisions/drafts from canon §9 (e.g. F1, D1, F-host).
#  - gate_deps: phase-gate events from §4 (G0-G5) a job waits on, distinct from job ids.
#  - builder/referee family: claude | codex | both (both families build/referee jointly) |
#    either (cast by prior accuracy post-Handover) | other (whichever family did not build).
#    "both"/"either"/"other" are the legal cross-family forms named in 14-BUILD-PLAN.md §6's
#    legend and are never flagged as a same-family referee.
#  - builder.title is a lane default (14-BUILD-PLAN.md §5), not a per-job assignment — the plan
#    names lane titles, not per-job titles.
#  - window_hours_est = turns_est / 8 (illustration ratio, 14-BUILD-PLAN.md §1, until B0-00).
#  - status is not_started for every row at population time; the register is imported at the
#    Handover (14-BUILD-PLAN.md §7).

