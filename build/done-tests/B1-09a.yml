#                               or $TMPDIR), removed afterwards; every ancestor's mode, owner and ACL
#                               allow entries are checked first, and a failure is Fatal (was Skipf).
#   ExecRunsOnlyMatchingDigest  + the in-place path refuses a foreign digest and another file's digest
#                               (/bin/bash), and runs under its own; the swapper stops at the first bad
#                               run and kills hash-then-re-read-to-copy.
#   WallBackstopKillsTree       SIGINT in [85%, 95%) (was [80%, 100%)); 60ms after the leader's
#                               SIGINT the group member is dead (group-wide SIGINT) and the leader is
#                               alive (no early SIGKILL); Run returns within wall + 1s (was + 4s).
#                               Upper bounds are judged from the leader's own start, lower bounds from
#                               the call: an Exec may start its clocks at either.
#   IdleBackstopKillsTree       silent tree returns within idle + 1s (was + 4s); the output control
#                               runs at idle 1.5s for 2.5s (an exec alone exceeded 700ms under load).
#   CtxCancelKillsTree          + Run returns within 1s of the cancel.
#   LeaderExitKillsTree         NEW: a leader exiting 0 or 3 leaves a group member and a setsid
#                               grandchild; Run kills both first; exit 3 is an *exec.ExitError.
#   RunnerAppliesLimits         NEW: the Runner passes job.Limits (Stdout, Dir, Wall, Idle) to the
