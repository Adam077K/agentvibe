#   Tests, 13 (was 8):
#   ExecInPlaceOrCopy           copies are judged against the resolved path too (/tmp, /var are
#                               symlinks on darwin); every ancestor of the RESOLVED path is checked
#                               (four levels up; through a symlinked directory); group bits count;
#                               /bin/bash in a worker root is copied and SIGKILLed by code signing,
#                               asserted as *exec.ExitError signal killed (was: any error passed); a
#                               protected script in a worker root is copied and runs. The uid-4242
