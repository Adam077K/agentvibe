#   Q4 Run before Reconcile: ErrState, before Launch (CapacityCap on an empty State; DaemonKilledMidJob
#      on a State with a running job). The daemon helper reconciles before it runs.
#   Q5 Capacity 0 means 4 (six concurrent: exactly 4 admitted); 12 accepted; 13 and -1 are ErrSpec.
