#   - r3 contract additions on the stub, each forced by a test below: Exec reports a worker's own
#     non-zero exit or signal death as an error wrapping its *exec.ExitError; Run returns only after
#     the tree is dead however the leader ended; the 90% SIGINT goes to the whole group; Runner.Run
