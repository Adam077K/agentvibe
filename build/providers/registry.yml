      - url: https://code.claude.com/docs/en/legal-and-compliance
        sha256: 512f9ce68f10e1cf13bb0bc99e9399e5700524dcfdcaf1e92658f06f168f9c9
        text: >-
          Advertised usage limits for Pro and Max plans assume ordinary, individual usage of Claude Code
          and the Agent SDK. OAuth authentication is intended exclusively for purchasers of Claude Free,
          Pro, Max, Team, and Enterprise subscription plans and is designed to support ordinary use of
