        sha256: 47945c571632e476314e9a2f2a31984891854f419a144edb66205a0af0b73c9
        text: >-
          Max 20x includes 20 times the Pro plan's per-session usage allowance. Your session-based usage
          limit will reset every five hours. Max plans also have a weekly usage limit that applies across
          all models.

