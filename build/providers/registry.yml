# Provider Contract Registry v0 -- B0-02 (docs/vision-v3/14-BUILD-PLAN.md section 6 P0)
#
# One row per (plan, model) for the founder's two subscriptions. Every quote below was fetched by this
# session via WebFetch on access_date; sha256 is computed over the exact quote text stored in this file
# (not over the page's raw HTML -- this sandbox blocks direct curl to external hosts, and WebFetch itself
# returns an LLM-processed rendering of the page rather than raw bytes; see README.md "Fetch method and
# its limits"). Numbers this session could not find published anywhere (Max 20x's absolute per-window and
# weekly token/message counts) are marked `unknown` per DR-61 -- B0-00 measures them directly.
#
# valid_until: 2026-10-31 for every row (one month; provider terms and limits have changed before -- see
# 09a-ENGINEERING.md section 10's "learned, not configured" note and the Codex 5-hour-limit removal/
# restoration history found during this fetch).

