      - url: https://learn.chatgpt.com/docs/non-interactive-mode
        sha256: ea6c7441350b08ecc846a3ef3487dd938d45265ca37cc8ce2a16a9e4627f5c9
        text: >-
          Read this if you need to run CI/CD jobs with a Codex user account instead of an API key, such as
          enterprise teams using ChatGPT-managed Codex access on trusted runners or users who need
          ChatGPT/Codex rate limits instead of API key usage. API keys are the right default for
          automation because they are simpler to provision and rotate. Use this path only if you
          specifically need to run as your Codex account.
          Do not use this workflow for public or open-source repositories.
          Treat ~/.codex/auth.json like a password: it contains access tokens. Don't commit it, paste it
          into tickets, or share it in chat.
