  # ── ADDED 2026-09-07 · the final-v2 review round ────────────────────────────────────────────
  # Four lanes closed their files with a "claims this lane emits / would register" table, in
  # backticked prose, ahead of ledger entries none of them could create — two say so in the
  # heading ("proposed; nothing appended ... this lane holds no `claim-append`"). That is 19
  # citations of ids that do not exist, and it turned `ledger lint` and `test:ledger` red.
  #
  # TWO of the nineteen became real project claims, in
  # docs/08-agents_work/sessions/2026-09-07-builder-ledger-citations.md, because each has a
  # deterministic check over this repository's own live configuration:
  # c-night-child-carries-no-project-hooks and c-allowwrite-only-widens. The seventeen below
  # did not, and the reason is the same shape for most of them: the measurement was a CELL —
  # a live `claude` child, a locked keychain, a provider account — and the only re-check
  # spawns one. `ledger verify` runs on every `npm run check`, so a claim like that would
  # spend money and a model call per check run, and would be nondeterministic besides. The
  # rest are framing about the unratified final-v2 plan, whose verifiers name files
  # (roster.yml, charter.yml, keel/shared/routing.yml, bin/check-stores) that do not exist.
  #
  # None of the seventeen is a defect in the lane that wrote it. A review finding recorded in
  # a review file is doing its job there; what it is not, yet, is a claim anything can resolve.

  - id: c-roster-shell-count-drifted
    scope: none
    why: L2 lane framing about the unratified final-v2 plan — the verifier it names is a check over roster.yml, which does not exist in this repo

