  - pattern: ".claude/qa-tier-floor.yml"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "This file itself — a bad tier map silently downgrades every review"
  - pattern: ".claude/hooks/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — PostToolUse / SessionStart hooks execute on every action"
  - pattern: ".claude/workflows/qa.js"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — the binding merge gate's own source. A change here changes what can merge, and the CEO cannot override the verdict it emits"
  - pattern: ".claude/workflows/lib/gate-logic.mjs"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — the verdict arithmetic. decideVerdict() is what turns findings into PASS or BLOCK"
    # THESE TWO WERE `lite` BY DEFAULT — nothing in this file matched `.claude/workflows/`
    # at all. The source of the gate that blocks merges was tiered BELOW `scripts/lib/**`,
    # which is the same class of file one directory over, and below `mission-control/test/
    # gate.ts`, which is floored at `full` for being "the shared implementation the tests
    # gate on". The gate's own implementation had no rule.
    #
    # WHY BOTH, AND NOT JUST qa.js. gate-logic.mjs is NOT imported by qa.js. Its own header:
    # "the Workflow runtime runs each .claude/workflows/*.js script in a sandbox with NO
