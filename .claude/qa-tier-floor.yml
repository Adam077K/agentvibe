    #   node <script FROM the found     belief.ts (node <projectRoot>/scripts/ledger.mjs,
    #   repository>                     cwd=projectRoot), fleet.ts (node <script> fleet)
    #                                                                           2 of 8
    #   a configured probe              empty.ts (execFileAsync(probeCmd.cmd, probeCmd.args)
    #                                   from projectEmptyStateProbe(project))    1 of 8
    #   nothing                         events.ts, transcripts.ts, probe-bounds.ts
