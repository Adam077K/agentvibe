  - pattern: "mission-control/test/**"
    tier: lite
    reason: "Test CASES. A test change that matters arrives beside the code it covers, and that code floors the whole change set at full — classifyFiles() takes the maximum, so the tier cannot be dodged by splitting the diff. The shared gate they run through is carved out above; this covers the *.test.ts files and their fixtures"
    # THE RESIDUAL, NAMED RATHER THAN LEFT TO BE DISCOVERED: a test-ONLY pull request that
