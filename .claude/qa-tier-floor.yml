# THE classifier's data file. One file computes risk.
#
# Consumers (all of them go through scripts/lib/classifier.js — there is no second
# implementation of this matching logic):
#   · scripts/classify.mjs            — the CLI
#   · .github/workflows/qa-lead-pass.yml — merge gate, calls the CLI
#   · scripts/ledger.mjs              — picks resolvers + enforcement per claim
#
# Each rule answers four questions about a path:
#   tier                  minimum review tier — workers may upgrade, never downgrade
#   resolvers             which claim resolvers must run over claims in that file
#   required_claim_kinds  which kinds of claim that file must carry (empty = none required)
#   enforcement           block = fails the build today · shadow = logs would_block only
#
# Tiers (ascending): trivial < lite < full < irreversible
#
# MATCH SEMANTICS — corrected 2026-08-11.
# This header used to read "first match wins (most-specific patterns FIRST)". Its only
# consumer — a bash reimplementation inside qa-lead-pass.yml — took the MAXIMUM tier
# across every matching pattern instead. The two happened to agree because the rules are
# ordered strictest-first, so nothing had broken; the documentation was simply false, and
# would have become wrong the moment anyone reordered this file.
#
#   tier                 → the STRICTEST matching rule wins (this is a floor)
#   resolvers            → union of all matching rules
#   required_claim_kinds → union of all matching rules
#   enforcement          → strictest of all matching rules (block beats shadow)
#   no match             → tier: lite (the default this file always claimed and never had —
#                          the bash started at trivial, rating bin/warroom a typo)
#
# Globs: `**/` = zero or more path segments · `*` = within one segment, does NOT cross `/`.
#
# Update protocol: append-only; if a pattern's tier changes, add a `supersedes:` entry and
# keep the old one commented for one release cycle.
# Test by execution: `node --test scripts/classifier.test.mjs`. Never by reading.

version: 2
generated: 2026-08-11

rules:
  # ──────────────── IRREVERSIBLE ────────────────
  # Money flows, schema changes, workflow definitions, agent identity.
  # Require: tier:full review + 2-of-3 multi-judge + Founder sign-off.
  #
  # `enforcement: block` on this group is the ADR-001 carve-out: every gate ships in
  # shadow mode first EXCEPT outbound send, deploy, migration and harness self-edit,
  # which block from day one because they are not revertible by a git revert.
  # Note this only bites files that actually carry claims — a file with no claim block
  # is unaffected by enforcement, whatever its tier.
  - pattern: "**/supabase/migrations/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "DB schema change — destructive replay impossible"
  - pattern: "**/prisma/migrations/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Prisma schema migrations"
  - pattern: "**/drizzle/migrations/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Drizzle schema migrations"
  - pattern: ".github/workflows/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — CI/CD changes affect every PR; a bad workflow blocks merges"
  - pattern: ".claude/agents/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — agent definitions; a bad prompt cascades across every spawn"
  - pattern: ".claude/settings.json"
    tier: irreversible
    enforcement: block
    reason: "Harness self-edit — runtime permission boundary"
  - pattern: ".claude/qa-tier-floor.yml"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "This file itself — a bad tier map silently downgrades every review"
  - pattern: ".claude/hooks/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — PostToolUse / SessionStart hooks execute on every action"
  - pattern: "scripts/lib/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — the classifier, claim parser and resolvers themselves"
  - pattern: "**/api/billing/**"
    tier: irreversible
    enforcement: block
    reason: "Payment/billing flow — silent failure = lost revenue"
  - pattern: "**/api/webhooks/**"
    tier: irreversible
    enforcement: block
    reason: "External webhook handlers — idempotency-critical"
  - pattern: "**/api/payments/**"
    tier: irreversible
    enforcement: block
    reason: "Payment processing endpoints"
  - pattern: "mission-control/server/config.ts"
    tier: irreversible
    enforcement: shadow
    reason: "Mission Control's network binding — HOST is a literal here so nothing can override it; moving it off 127.0.0.1 converts three local RCEs into remote ones, and no revert un-executes what already ran"
    # WHY IRREVERSIBLE AND NOT FULL. This is the same category as `.claude/settings.json`
    # above — a runtime permission boundary, not application code. The file is thirteen
    # lines and has changed exactly once (e29f2c0, the PR that created it), so Founder
    # sign-off costs approximately nothing here and buys the one review a `lite` pass would
    # wave through as a one-word diff.
    #
    # WHY `enforcement: shadow` WHEN EVERY OTHER IRREVERSIBLE ENTRY BLOCKS. `enforcement`
    # governs CLAIM resolution, and only claim-bearing files feel it. scripts/ledger.mjs
    # collects claims from `*.md`/`*.markdown` alone (candidateMarkdown()), so no `.ts` path
    # can carry a claim at all — `block` here would be a mechanism that fires on nothing,
    # which is exactly what the note below this group refuses to do for outbound send. It
    # goes to `block` the day a claim can live in a TypeScript file.
    #
  - pattern: "mission-control/server/trust.ts"
    tier: irreversible
    enforcement: shadow
    reason: "The allowlist deciding whose code may be executed on this machine — a regression re-opens the three RCEs of 2026-08-14, and a revert restores the file without un-executing what ran"
    # ADDED THE DAY THE FILE ARRIVED, not before. This entry was written out of the first
    # draft of these rules with its reason recorded — the file did not exist on `main` and a
    # pattern matching nothing reads as coverage it does not have, per the outbound-send note
    # below. PR #44 landed it (85a9eb9) and the objection is now void, so the rule goes in.
    #
    # `routes/guard.ts` is deliberately NOT here and stays `full`. Its own header states the
    # case: it is "not a second, independent answer to the three RCEs; it is the other half
    # of one". Weakening the cross-site check does not by itself grant execution — the
    # allowlist still gates that — so it is a `full` review, not a Founder decision.
    #
    # THE COST, MEASURED RATHER THAN WAVED AT. This is the second path in the tree that can
    # demand the `risk:irreversible` label, and that label arms the F13 step of
    # qa-lead-pass.yml, which requires EVERY session file in the PR diff to declare
    # `tier: full|irreversible` (:339-351). PR #42 recorded that as two mechanisms computing
    # risk and disagreeing, and left the fix for a later session. Executing F13's own
    # predicate over the four merged PRs that carried more than one session file: #25, #29
    # and #43 would be REFUSED, #42 would pass. So this entry raises exposure to a known
    # defect it does not create. It is bounded — the hazard needs a PR that touches trust.ts
    # AND bundles an honestly-lite session — and a change to this file has an honest tier of
    # `full` anyway. Named here so a red build is actionable rather than mysterious.
  # NOT LISTED, deliberately: an outbound-send pattern. ADR-001 names outbound send as a
  # day-one blocker, but this repository has no outbound-send path to name. A pattern
  # matching nothing would read as coverage it does not have. It is added the day the
  # mechanism is.

  # ──────────────── FULL ────────────────
  # API routes, auth, agent business logic, DB queries from app code.
  - pattern: "**/api/**"
    tier: full
    reason: "Public API surface; security + correctness"
  - pattern: "**/lib/agents/**"
    tier: full
    reason: "Agent execution + LLM routing"
  - pattern: "**/lib/auth/**"
    tier: full
    reason: "Auth helpers — session + role checks"
  - pattern: "**/middleware.ts"
    tier: full
    reason: "Every request runs through middleware"
  - pattern: "**/middleware.js"
    tier: full
    reason: "Every request runs through middleware"
  - pattern: "**/inngest/**"
    tier: full
    reason: "Background jobs — failures retry silently"
  - pattern: "**/lib/credit*/**"
    tier: full
    reason: "Credit / quota logic — pricing-critical"
  - pattern: "docs/09-metrics/**"
    tier: full
    resolvers: [claim-source, claim-freshness]
    required_claim_kinds: [external-fact]
    reason: "Numbers that get acted on — an invented metric is unrecoverable, unlike a bad diff"
    # AGENT-SYSTEM-REBUILD.md §3.2 shows `claim-arithmetic` here. It is deliberately NOT
    # listed: no such resolver is implemented, and naming a mechanism that does not exist
    # is the exact defect this rebuild was called to fix. It goes in the day it runs.
    # `resolvers:` accepts only implemented names — scripts/lib/resolvers.js is the
    # registry, and an unknown name makes the classifier throw.
  - pattern: "scripts/**"
    tier: full
    resolvers: [claim-command]
    reason: "Harness machinery — the ledger, the linters, the installer"
  - pattern: "bin/**"
    tier: full
    resolvers: [claim-command]
    reason: "The launcher every project starts from"

  # ──────────────── FULL · mission-control ────────────────
  # Until this group existed, every path under mission-control/ matched NOTHING and
  # classified `lite` by default — including the code that decides whose programs get
  # executed on this machine. Four PRs (#30, #32, #44 by label; #41 not) were tiered by a
  # human remembering to, which this repository's own rules table calls a wish.
  #
  # The split is deliberate and the whole tree is NOT floored at `full`. Flooring
  # client/** would make a CSS edit a full-tier review, and a gate that fires on
  # everything is a gate people route around — see docs/09-metrics and #42 for what that
  # looks like once it has happened.
  - pattern: "mission-control/server/**"
    tier: full
    reason: "The server decides whose code runs here — routes, trust, discovery, and six of eight collectors shell out to git with cwd inside a repository they merely found on disk"
    # Named because reading the glob is not the same as knowing what it matches: this is
    # server/{config,index,index-store,projects,state}.ts, server/lib/**, server/routes/**
    # and server/collectors/** — twenty files on `main`, twenty-three after PR #44 adds
    # app.ts, trust.ts and routes/guard.ts. Pinned by execution in
    # scripts/classifier.test.mjs; `node scripts/classify.mjs --json --stdin` reproduces it.
  - pattern: "mission-control/scripts/**"
    tier: full
    reason: "Operator tooling — it edits the trusted-projects allowlist and spawns the server; the `scripts/**` rule above is anchored at the repository root and never reached this tree"
  - pattern: "mission-control/check.mjs"
    tier: full
    reason: "Runs inside `npm run check` and spawns the server — a gate that lies about its own subject is worse than no gate"

  # ──────────────── LITE ────────────────
  # General app code: UI components, pages, utilities.
  - pattern: "**/components/**"
    tier: lite
    reason: "UI components; visual review sufficient"
  - pattern: "apps/**/src/**"
    tier: lite
    reason: "Monorepo app source — auth/api branches caught above"
  - pattern: "src/**"
    tier: lite
    reason: "Root app source — auth/api branches caught above"
  - pattern: "packages/**"
    tier: lite
    reason: "Shared packages — affect all consumers"
  - pattern: "docs/02-competitive/**"
    tier: lite
    resolvers: [claim-source, claim-freshness]
    required_claim_kinds: [external-fact]
    reason: "Competitive claims about the outside world — they rot, and nobody notices"
  - pattern: "docs/03-system-design/**"
    tier: lite
    resolvers: [claim-command, claim-freshness]
    reason: "Design docs assert what the system does — verifiable by running it"
  - pattern: ".claude/memory/**"
    tier: lite
    resolvers: [claim-freshness]
    reason: "Durable memory — the surface that went stale invisibly and started this rebuild"
  # These two change no tier — `lite` is already the default. They exist so that "the
  # client and the tests are lite" is a decision on the record with a reason attached,
  # rather than the silence that let the whole tree default for five PRs. The classifier
  # reports `matched:` for them now instead of `(none — default)`, which is the difference
  # between a considered answer and an absent one. Precedent: `src/**` and `packages/**`
  # above are documentary in exactly the same way.
  - pattern: "mission-control/client/**"
    tier: lite
    reason: "Browser render only — no filesystem access, no process spawn, no trust decision; the views read an API they cannot widen"
  - pattern: "mission-control/test/**"
    tier: lite
    reason: "Tests. A test change that matters arrives beside the code it covers, and that code floors the whole change set at full — classifyFiles() takes the maximum, so the tier cannot be dodged by splitting the diff"
    # THE RESIDUAL, NAMED RATHER THAN LEFT TO BE DISCOVERED: a test-ONLY pull request that
    # weakens mission-control/test/trust.test.ts still classifies `lite`. That is the known
    # hole in this rule. The alternative — flooring 10 test files at `full` so that a view
    # snapshot update needs a security reviewer — buys one case and pays for it on every
    # other, and `scripts/**` covers its own tests only as a side effect of covering the
    # directory, not as a decision anyone made.

  # ──────────────── TRIVIAL ────────────────
  # Docs, planning, brand guidelines — text only, no executable risk.
  - pattern: "docs/06-codebase/ledger-canary.md"
    tier: trivial
    resolvers: [claim-source, claim-freshness]
    reason: "The canary — a claim that is supposed to fail. If ledger verify ever reports zero would_blocks, the resolvers stopped firing"
  - pattern: "docs/**"
    tier: trivial
    reason: "Documentation — schema-lint sufficient"
  - pattern: "**/*.md"
    tier: trivial
    reason: "Markdown — text only"
  - pattern: "**/CHANGELOG*"
    tier: trivial
    reason: "Changelog edits"
  - pattern: "README*"
    tier: trivial
    reason: "Readme edits"
