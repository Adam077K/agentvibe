  - pattern: "mission-control/client/vite.config.ts"
    tier: irreversible
    enforcement: shadow
    reason: "The OTHER loopback binding — the dev server on 4301 proxies /api and /events straight to 4300, so moving this host off 127.0.0.1 exposes the same surface server/config.ts is floored to protect"
    # FOUND BY REVIEW, and it was hiding inside a reason rather than inside a gap. The
