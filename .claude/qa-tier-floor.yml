    # — qa.js:101 ("it is not contained, and it will not be until the sandbox exists"),
    # reviewer-readonly.md:50, DECISIONS.md:624 — so the PR that creates it is the one PR most
    # likely to be written under time pressure and by an author who did not read this file. A
