  - pattern: "mission-control/client/**"
    tier: lite
    reason: "The browser views and their styles — render only, no filesystem access, no process spawn, no trust decision; they read an API they cannot widen. Scope is the views: vite.config.ts is carved out above, and this reason does not describe build or dev-server configuration"
  - pattern: "mission-control/test/gate.ts"
    tier: full
    reason: "Not a test — the shared implementation the tests gate on. Its own header: 'THE machine gate. One implementation, the way scripts/lib/classifier.js is the one implementation of risk. Not a `.test.` file'"
    # WHY FULL AND NOT IRREVERSIBLE, since the header invites the comparison with
    # scripts/lib/** and that group is irreversible. The two differ on the ADR-001 test —
