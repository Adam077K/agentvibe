  - pattern: ".claude/sandbox/**"
    tier: irreversible
    enforcement: block
    resolvers: [claim-command]
    reason: "Harness self-edit — the containment policy. A weakened sandbox is not undone by a revert, because whatever escaped it has already run"
    # THIS PATTERN MATCHES NOTHING TODAY, AND THAT IS A DEPARTURE FROM THIS FILE'S OWN
    # PRECEDENT — stated here rather than left for review to find. Twice above, this file
    # refuses exactly this: the outbound-send note ("a pattern matching nothing would read as
    # coverage it does not have. It is added the day the mechanism is") and the trust.ts note
    # ("ADDED THE DAY THE FILE ARRIVED, not before"). Both refusals still look right to me.
    #
    # THE ARGUMENT FOR OVERRIDING THEM, which is narrower than those two cases. Outbound send
    # names a capability this repository does not have; trust.ts named a file that a specific
    # PR was about to add, so the rule could ride in with it. The sandbox is different in one
