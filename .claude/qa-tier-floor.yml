  - pattern: "mission-control/server/**"
    tier: full
    reason: "The server decides whose code runs here — routes, trust, discovery, and five of eight collectors execute a program with cwd inside a repository they merely found on disk; two of those run a script belonging to that repository, not a system binary"
    # THE COLLECTOR COUNT IS EXECUTED, NOT ESTIMATED. An earlier draft of this reason said
    # "six of eight collectors shell out to git". Both halves were wrong, and the second was
