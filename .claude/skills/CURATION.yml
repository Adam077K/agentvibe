# WHY (§3.10): "add ~6 namespace router skills so the discovery tier stops growing
# linearly." Measured: MANIFEST.json was 54,001 bytes / ~15,000 tokens across 147 entries,
# and it is read on EVERY skill lookup. That is more than double the whole lens+playbook
# injection, and it grew with every skill added. The curation took it to ~8,500 tokens; the
# routers take a typical lookup to ~1,200 — read six one-line namespace summaries, then one
# namespace, then the skill.
#
# Assignment is DATA, not a heuristic over skill names. A regex that infers "security" from
# a filename works until `sharp-edges` or `trust-spec-contracts`, and then it is silently
