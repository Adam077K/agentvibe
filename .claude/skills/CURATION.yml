# Skills curation — every cut, with the test that made it and a reason.
#
# WHY THIS FILE EXISTS (Phase 7, 2026-08-12)
#
# Deleting ~half a skills library by taste is unauditable, and "I curated it" is exactly the
# kind of unfalsifiable claim this repo exists to stop. So every cut is recorded here with
# the test it failed, `scripts/curate-skills.mjs --check` proves the directory matches this
# file, and CI fails when they drift. A skill that comes back has to argue with a named test.
#
# THE FOUR TESTS, from AGENT-SYSTEM-REBUILD §3.10:
#
#   1. CUT TEST — delete only what is useless in EVERY project, never what is unused HERE.
#      This is why every AWS skill survives: this repo is Vercel + Supabase and uses none of
#      them, but "unused here" is explicitly not the bar. Cutting to the local stack would
#      have removed 11 skills and been wrong.
#
#   2. ENCODED-PROCEDURE TEST — keep only what a frontier model will not reconstruct unaided.
#      A file explaining what a README is fails. A file carrying a specific tool's non-obvious
#      API, a measured threshold, or a procedure someone paid to learn passes.
#
#   3. SIZE DISCIPLINE — body under 500 lines, ToC over 300, the rest in bundled references.
#
#   4. LINT ONLY WHAT IS UNIVERSAL — `name` and `description` are the only near-universal
#      frontmatter fields across the 803-file candidate pool. Requiring more fails on contact
#      with any corpus we did not author.
#
# NOT DONE, AND NAMED RATHER THAN IMPLIED: the 803 external candidates across 11 public
# corpora were NOT evaluated. They are not on this machine and ingesting them means fetching
# 11 repositories. This curation is therefore "the local 147, honestly cut" — it is NOT
# "the best ~70 in the world", and that claim is not made anywhere.

version: 1
curated_on: 2026-08-12
source_count: 147

# ── SEVEN OF THE 63 CUTS DID NOT REMOVE THE NAME ────────────────────────────
#
# `~/.claude/skills/` exists on this machine with 42 skill directories, 32 of them symlinks.
# Deleting a repo skill does not remove the name — it UN-SHADOWS the global copy, exactly as
# deleting a repo agent does. Phase 4b learned this for agents and kept eleven shims; the
# same hazard sits one directory over and was not checked until the runtime kept offering
# five skills after they were deleted.
#
# Measured: 7 of 63 cuts have a global twin, and FIVE of those seven are DRIFTED, so the name
# now resolves to different content than the file that was removed:
#
#     web-design-guidelines          DRIFTED
#     vercel-cli-with-tokens         DRIFTED
#     vercel-react-best-practices    DRIFTED
#     humanizer                      DRIFTED
#     frontend-design                DRIFTED
#     deploy-to-vercel               identical
#     vercel-react-view-transitions  identical
#
# NOT SHIMMED, and here is why the agent decision does not carry over: a drifted global AGENT
# silently changes who does the work and what it is allowed to do — `@ceo` would have become a
# 313-line Sonnet definition routing to four retired agents. A drifted global SKILL changes
# what reference text a model reads on request. The blast radius is a worse paragraph, not a
# different actor with different tools. So this is measured, named, and left to Phase 9 with
# the rest of the global reconciliation — per the founder decision that no global state is
# touched before then.
#
# `scripts/check-registration.mjs` check 10 reports this on every run so the list stays
# measured rather than rediscovered.
#
# The first measurement of this said "0 cuts un-shadow a global" and was WRONG: it used
# readdir withFileTypes + isDirectory(), which reports false for a symlink, while 32 of the
# 42 globals are symlinks. statSync follows them. A fast wrong number is worse than a slow
# right one, and it took a contradicting bash `-d` check to catch it.
shadowed_by_global:
  drifted: [web-design-guidelines, vercel-cli-with-tokens, vercel-react-best-practices, humanizer, frontend-design]
  identical: [deploy-to-vercel, vercel-react-view-transitions]

# ── Test: role-duplicate ────────────────────────────────────────────────────
# Agent personas wearing a skill's clothes. Every one reads "Elite X expert specialising in"
# or "Build X, implement Y" — the exact shape of the 26 agent files Phase 4b collapsed into
# six engines plus lenses. They survived because that phase walked .claude/agents/ and this
# is .claude/skills/. A checker's coverage is not its subject, for the fourth time.
# The replacement already exists: an engine carries the procedure, a lens carries the domain.
role_duplicate:
  - code-reviewer          # reviewer engine + review-lenses.yml(correctness, craft)
  - frontend-developer     # builder engine + lenses.yml(engineering)
  - data-engineer          # builder engine + lenses.yml(engineering)
  - ai-engineer            # builder engine + lenses.yml(engineering)
  - rag-engineer           # builder engine; the specifics live in embedding-strategies
  - vector-database-engineer # same; pgvector-rag-conventions holds what is non-obvious
  - debugger               # systematic-debugging holds the procedure; this holds a job title
  - search-specialist      # sourcer engine — "never assert without evidence" is its whole body
  - ai-agents-architect    # orchestrator engine + multi-agent-patterns
  - cloud-devops           # builder engine; deployment-procedures holds the procedure
  - architecture           # framer engine + architecture-decision-records

