  # engine loads on every framing task is not "useless in every project", which is the only
  # bar test 1 allows. Kept, and the reversal is recorded rather than the list quietly edited.
  - screenshots       # "take a screenshot"
  - core-components   # a generic component-library inventory
  # RE-EXAMINED before merge, because the drifted global copy looked good enough to reverse
  # the cut. It does not — it is a DIFFERENT document, not a drifted one. Measured on the
  # 277-line repo copy that was deleted: 30 headings, ZERO hex values, ZERO px/rem values,
  # 2 code fences, and an invented "Design Feasibility & Impact Index (DFII)" with a scoring
  # formula. 277 lines of design guidance without a single measurable anchor is the exact
  # failure the lens linter catches in a lens ("a vague step with no measurable anchor fails").
  # The cut stands, and now on a number rather than an impression.
  #
  # The 55-line GLOBAL frontend-design is a different matter and should be IMPORTED: it names
