# ── Test: reconstructible ───────────────────────────────────────────────────
# A frontier model produces these unaided and to a higher standard than a 200-line file
# describing them. Keeping one costs tokens on every discovery pass and teaches nothing.
reconstructible:
  - readme            # "what a README should contain"
  - commit            # "write a good commit message"
  - create-pr         # "open a pull request"
  - copywriting       # general persuasive-writing advice
  - humanizer         # "make text sound less like AI"
  - data-storytelling # "charts should have a point"
  # REVERSED: `brainstorming` was listed here and the tool refused the cut — framer.md
  # declares it in frontmatter. That declaration is evidence, not an obstacle: a skill an
  # engine loads on every framing task is not "useless in every project", which is the only
  # bar test 1 allows. Kept, and the reversal is recorded rather than the list quietly edited.
  - screenshots       # "take a screenshot"
  - core-components   # a generic component-library inventory
  # RE-EXAMINED before merge, because the drifted global copy looked good enough to reverse
  # the cut. It does not — it is a DIFFERENT document, not a drifted one. Measured on the
  # 277-line repo copy that was deleted: 30 headings, ZERO hex values, ZERO px/rem values,
  # 2 code fences, and an invented "Design Feasibility & Impact Index (DFII)" with a scoring
  # formula. 277 lines of design guidance without a single measurable anchor is the exact
  # failure the lens linter catches in a lens ("a vague step with no measurable anchor fails").
  # The cut stands, and now on a number rather than an impression.
  #
  # The 55-line GLOBAL frontend-design is a different matter and should be IMPORTED: it names
  # the three looks AI-generated design clusters into, with a hex value (#F4F1EA), warns about
  # .section/.cta specificity cancelling padding, and gives a concrete token rubric. A model
  # does not reconstruct a critique of its own default aesthetic — that is the test, passed.
  - frontend-design
  - documentation-templates # same: what remains is a heading skeleton

