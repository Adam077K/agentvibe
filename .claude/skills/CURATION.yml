# Skills curation — every cut, with the test that made it and a reason.
#
# WHY THIS FILE EXISTS (Phase 7, 2026-08-12)
#
# Deleting ~half a skills library by taste is unauditable, and "I curated it" is exactly the
# kind of unfalsifiable claim this repo exists to stop. So every cut is recorded here with
# the test it failed, `scripts/curate-skills.mjs --check` proves the directory matches this
# file, and CI fails when they drift. A skill that comes back has to argue with a named test.
#
# THE FOUR TESTS, from AGENT-SYSTEM-REBUILD §3.10:
#
#   1. CUT TEST — delete only what is useless in EVERY project, never what is unused HERE.
#      This is why every AWS skill survives: this repo is Vercel + Supabase and uses none of
#      them, but "unused here" is explicitly not the bar. Cutting to the local stack would
#      have removed 11 skills and been wrong.
#
#   2. ENCODED-PROCEDURE TEST — keep only what a frontier model will not reconstruct unaided.
#      A file explaining what a README is fails. A file carrying a specific tool's non-obvious
#      API, a measured threshold, or a procedure someone paid to learn passes.
#
#   3. SIZE DISCIPLINE — body under 500 lines, ToC over 300, the rest in bundled references.
#
#   4. LINT ONLY WHAT IS UNIVERSAL — `name` and `description` are the only near-universal
#      frontmatter fields across the 803-file candidate pool. Requiring more fails on contact
#      with any corpus we did not author.
#
# NOT DONE, AND NAMED RATHER THAN IMPLIED: the 803 external candidates across 11 public
# corpora were NOT evaluated. They are not on this machine and ingesting them means fetching
# 11 repositories. This curation is therefore "the local 147, honestly cut" — it is NOT
# "the best ~70 in the world", and that claim is not made anywhere.

version: 1
curated_on: 2026-08-12
source_count: 147

