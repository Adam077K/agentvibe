# Agent personas wearing a skill's clothes. Every one reads "Elite X expert specialising in"
# or "Build X, implement Y" — the exact shape of the 26 agent files Phase 4b collapsed into
# six engines plus lenses. They survived because that phase walked .claude/agents/ and this
# is .claude/skills/. A checker's coverage is not its subject, for the fourth time.
# The replacement already exists: an engine carries the procedure, a lens carries the domain.
